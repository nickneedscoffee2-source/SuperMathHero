<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Math Hero - 16-Bit Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050510; color: #fff;
            font-family: 'Bubblegum Sans', cursive, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #game-wrapper {
            position: relative; width: 960px; height: 540px;
            box-shadow: 0 0 30px #0ea5e9; border: 4px solid #1e293b; border-radius: 8px;
        }
        #game-wrapper:fullscreen, #game-wrapper:-webkit-full-screen {
            width: 100vw; height: 100vh; border: none; border-radius: 0; box-shadow: none; background-color: #050510;
        }
        #game-container { image-rendering: optimizeQuality; width: 100%; height: 100%; }
        
        #ui-panel {
            text-align: center; width: 960px; background: #0f172a;
            padding: 10px 0px; border-radius: 8px; border: 1px solid #334155; margin-top: 10px;
        }
        .controls { color: #facc15; font-weight: bold; font-size: 20px; margin: 5px 0; font-family: 'Bubblegum Sans', cursive;}
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); border-radius: 4px;
        }
        .start-box {
            background: #1e293b; border: 4px solid #38bdf8; border-radius: 12px; padding: 25px 40px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 90%; overflow-y: auto;
        }
        .start-box h1 { 
            color: #facc15; font-size: 55px; margin: 0 0 20px 0; text-shadow: 4px 4px 0 #000; 
            font-family: 'Luckiest Guy', cursive; letter-spacing: 2px;
        }
        .input-group { margin: 15px 0; font-size: 24px; font-family: 'Bubblegum Sans', cursive; }
        .input-group input[type="text"] {
            font-family: 'Bubblegum Sans', cursive; font-size: 24px; padding: 8px;
            border-radius: 6px; border: 2px solid #38bdf8; outline: none; width: 220px; text-align: center;
        }
        .swatch-container { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .color-swatch {
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid transparent;
        }
        .color-swatch.selected { border-color: #facc15; transform: scale(1.2); }
        .btn-start {
            background: #22c55e; color: #fff; font-family: 'Luckiest Guy', cursive; font-size: 28px;
            padding: 10px 30px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px;
            box-shadow: 0 5px 0 #166534; letter-spacing: 1px;
        }
        .btn-start:active { transform: translateY(5px); box-shadow: 0 0 0 #166534; }
        
        .overlay-btn {
            position: absolute; top: 10px; padding: 8px 12px;
            background: #1e293b88; border: 2px solid #38bdf8; border-radius: 6px;
            color: #fff; font-family: 'Bubblegum Sans', cursive; font-size: 18px;
            cursor: pointer; z-index: 10; backdrop-filter: blur(4px);
        }
        .overlay-btn:hover { background: #38bdf8; color: #000; }
        #btn-fullscreen { right: 10px; }
        #btn-music { right: 130px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="start-screen">
            <div class="start-box">
                <h1>SUPER MATH HERO</h1>
                <div class="input-group">
                    <label>Ninja Name: </label><br>
                    <input type="text" id="playerName" placeholder="Enter Name" maxlength="12" value="Hero" onblur="globalPlayerName=this.value; if(window.loadGameData) window.loadGameData(this.value)">
                </div>
                <div class="input-group">
                    <label>Select Ninja:</label><br>
                    <input type="radio" name="gender" value="boy" id="g-boy" checked> <label for="g-boy">Boy</label>
                    &nbsp;&nbsp;&nbsp;
                    <input type="radio" name="gender" value="girl" id="g-girl"> <label for="g-girl">Girl</label>
                </div>
                <div class="input-group">
                    <label>Skin Tone:</label>
                    <div class="swatch-container" id="swatches"></div>
                </div>
                
                <div id="bonus-equipment" style="display:none; margin-top: 20px; padding-top: 15px; border-top: 2px dashed #334155;">
                    <div class="input-group" id="helmet-group" style="display:none;">
                        <label style="color:#38bdf8;">Helmet Equip:</label><br>
                        <input type="radio" name="helmet" value="none" id="h-none" checked> <label for="h-none">None</label>
                        &nbsp;&nbsp;&nbsp;
                        <input type="radio" name="helmet" value="lion" id="h-lion"> <label for="h-lion" style="color:#facc15;">Lion Helmet</label>
                    </div>
                    <div class="input-group" id="belt-group" style="display:none;">
                        <label style="color:#38bdf8;">Belt Equip:</label><br>
                        <input type="radio" name="belt" value="none" id="b-none" checked> <label for="b-none">None</label>
                        &nbsp;&nbsp;&nbsp;
                        <input type="radio" name="belt" value="equipped" id="b-equipped"> <label for="b-equipped" style="color:#facc15;">Champion Belt</label>
                    </div>
                    <div class="input-group" id="outfit-group" style="display:none;">
                        <label style="color:#38bdf8;">Outfit:</label><br>
                        <input type="radio" name="outfit" value="default" id="o-def" checked> <label for="o-def">Default</label>
                        &nbsp;&nbsp;&nbsp;
                        <input type="radio" name="outfit" value="karate" id="o-karate"> <label for="o-karate" style="color:#facc15;">Karate Gi</label>
                    </div>
                    <div class="input-group" id="glasses-group" style="display:none;">
                        <label style="color:#38bdf8;">Glasses:</label><br>
                        <input type="radio" name="glasses" value="none" id="gl-none" checked> <label for="gl-none">None</label>
                        &nbsp;&nbsp;&nbsp;
                        <input type="radio" name="glasses" value="macho" id="gl-macho"> <label for="gl-macho" style="color:#facc15;">Macho Shades</label>
                    </div>
                    <div class="input-group" id="power-group" style="display:none;">
                        <label style="color:#38bdf8;">Power:</label><br>
                        <input type="radio" name="power" value="none" id="p-none" checked> <label for="p-none">None</label>
                        &nbsp;&nbsp;&nbsp;
                        <input type="radio" name="power" value="levitate" id="p-levi"> <label for="p-levi" style="color:#facc15;">Levitation</label>
                    </div>
                </div>

                <button class="btn-start" onclick="startGame()">START GAME! [Press ENTER]</button>
            </div>
        </div>
        
        <button id="btn-music" class="overlay-btn" style="display:none;">🔊 MUSIC ON</button>
        <button id="btn-fullscreen" class="overlay-btn">⛶ FULLSCREEN</button>
        <div id="game-container"></div>
    </div>
    
    <div id="ui-panel">
        <p class="controls">ARROWS: Move | ALT/SPACE: Jump | SHIFT: Green Shot | CTRL: Red Shot | HOLD to Charge | ESC: Pause</p>
    </div>

    <script>
        window.appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initFirebase = async () => {
            try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                const { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                const { getFirestore, doc, setDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                window.firebaseDb = getFirestore(app);
                window.setDoc = setDoc;
                window.getDoc = getDoc;
                window.doc = doc;
                
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => { window.firebaseUser = user; if(user) window.loadGameData(document.getElementById('playerName').value || 'Hero'); });
            } catch(e) { console.error("Firebase init error:", e); }
        };
        initFirebase();

        window.saveGameData = async function() {
            if (!window.firebaseDb || !window.firebaseUser) return;
            try {
                const saveRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'users', window.firebaseUser.uid, 'saves', globalPlayerName);
                await window.setDoc(saveRef, {
                    money: window.gameStats.money, unlockedBelts: window.unlockedBelts, unlockedUltimateBelt: window.unlockedUltimateBelt,
                    unlockedLionHelmet: window.unlockedLionHelmet, unlockedKarate: window.unlockedKarate, unlockedMacho: window.unlockedMacho, unlockedLevitate: window.unlockedLevitate
                }, { merge: true });
            } catch(e) {}
        };

        window.loadGameData = async function(playerName) {
            if (!window.firebaseDb || !window.firebaseUser) return;
            try {
                const saveRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'users', window.firebaseUser.uid, 'saves', playerName);
                const snap = await window.getDoc(saveRef);
                if (snap.exists()) {
                    let d = snap.data();
                    window.gameStats.money = d.money || 0; window.unlockedBelts = d.unlockedBelts || []; window.unlockedUltimateBelt = d.unlockedUltimateBelt || false;
                    window.unlockedLionHelmet = d.unlockedLionHelmet || false; window.unlockedKarate = d.unlockedKarate || false;
                    window.unlockedMacho = d.unlockedMacho || false; window.unlockedLevitate = d.unlockedLevitate || false;
                    window.updateEquipmentUI();
                }
            } catch(e) {}
        };

        window.updateEquipmentUI = function() {
            document.getElementById('bonus-equipment').style.display = 'block';
            if (window.unlockedLionHelmet) document.getElementById('helmet-group').style.display = 'inline-block';
            if (window.unlockedUltimateBelt) document.getElementById('belt-group').style.display = 'inline-block';
            if (window.unlockedKarate) document.getElementById('outfit-group').style.display = 'inline-block';
            if (window.unlockedMacho) document.getElementById('glasses-group').style.display = 'inline-block';
            if (window.unlockedLevitate) document.getElementById('power-group').style.display = 'inline-block';
        };

        const kidFont = '"Bubblegum Sans", cursive';
        const titleFont = '"Luckiest Guy", cursive';
        
        let globalSkinTone = '#c68642'; 
        let globalGender = 'boy';
        let globalPlayerName = 'Hero';
        let globalHelmet = 'none';
        let globalBelt = 'none';
        let globalOutfit = 'default';
        let globalGlasses = 'none';
        let globalPower = 'none';
        
        let playerCanvas = null;

        window.gameStats = { correct: 0, total: 0, money: 0.00 };
        window.tempUpgrades = { hearts: false, invincibility: false, teddyBears: false, karate: false, macho: false, levitate: false };
        
        window.unlockedBelts = [];
        window.unlockedUltimateBelt = false;
        window.unlockedLionHelmet = false;
        window.unlockedKarate = false;
        window.unlockedMacho = false;
        window.unlockedLevitate = false;
        window.storeBank = [];

        const skinTones = ['#ffdfc4', '#f0d5be', '#d2b48c', '#c68642', '#8d5524', '#613d30', '#3e2821', '#2a1711'];
        const swatchContainer = document.getElementById('swatches');
        skinTones.forEach((color, i) => {
            let s = document.createElement('div');
            s.className = 'color-swatch' + (i===3 ? ' selected' : '');
            s.style.backgroundColor = color;
            s.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
                s.classList.add('selected');
                globalSkinTone = color;
            };
            swatchContainer.appendChild(s);
        });

        let cachedVoices = [];
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { cachedVoices = window.speechSynthesis.getVoices(); };
        }

        let gameStarted = false; let gameInstance = null;

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;

            globalPlayerName = document.getElementById('playerName').value || 'Hero';
            globalGender = document.querySelector('input[name="gender"]:checked').value;
            if(document.getElementById('helmet-group').style.display !== 'none') globalHelmet = document.querySelector('input[name="helmet"]:checked').value;
            if(document.getElementById('belt-group').style.display !== 'none') globalBelt = document.querySelector('input[name="belt"]:checked').value;
            if(document.getElementById('outfit-group').style.display !== 'none') globalOutfit = document.querySelector('input[name="outfit"]:checked').value;
            if(document.getElementById('glasses-group').style.display !== 'none') globalGlasses = document.querySelector('input[name="glasses"]:checked').value;
            if(document.getElementById('power-group').style.display !== 'none') globalPower = document.querySelector('input[name="power"]:checked').value;

            window.gameStats = { correct: 0, total: 0, money: 0.00 };
            window.tempUpgrades = { hearts: false, invincibility: false, teddyBears: false, karate: false, macho: false, levitate: false };

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('btn-music').style.display = 'block';
            
            initAudio(); 
            
            if ('speechSynthesis' in window) {
                let msg = new SpeechSynthesisUtterance("");
                msg.volume = 0; window.speechSynthesis.speak(msg);
            }
            if(!gameInstance) { initPhaser(); }
            else { 
                gameInstance.scene.getScenes(true).forEach(s => s.scene.stop());
                gameInstance.scene.getScene('BootScene').scene.start();
            }
        }

        const enterListener = function(e) {
            if (e.key === 'Enter') {
                const startScreen = document.getElementById('start-screen');
                if (startScreen && startScreen.style.display !== 'none') {
                    initAudio(); // Force audio context init on enter
                    startGame();
                }
            }
        };
        window.addEventListener('keydown', enterListener);

        let audioCtx;
        let masterGain;
        let isMuted = false;
        let mainBgmInterval = null;
        let starBgmInterval = null;
        
        function initAudio() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
            masterGain.gain.value = isMuted ? 0 : 1;
        }

        function playSynth(type, freq, duration, slide = 0, volume = 0.1) {
            if(isMuted) return;
            if(!audioCtx) initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.connect(gain); gain.connect(masterGain);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slide !== 0) { osc.frequency.exponentialRampToValueAtTime(Math.max(freq + slide, 10), audioCtx.currentTime + duration); }
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playOcarinaNote(freq, startTime, duration, vol = 0.2) {
            if(isMuted) return;
            if(!audioCtx) initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
            osc.type = 'triangle'; lfo.type = 'sine'; lfo.frequency.value = 6; lfoGain.gain.value = 5;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency); osc.connect(gain); gain.connect(masterGain);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(vol, startTime + 0.05);
            gain.gain.setValueAtTime(vol, startTime + duration - 0.05);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);
            lfo.start(startTime); osc.start(startTime);
            osc.stop(startTime + duration); lfo.stop(startTime + duration);
        }

        let lastHeroSpeakTime = 0;
        function speakVoice(text, pitch, rate) {
            if (isMuted || !('speechSynthesis' in window)) return;
            let now = Date.now();
            if (now - lastHeroSpeakTime < 800) return; 
            
            lastHeroSpeakTime = now;
            
            let msg = new SpeechSynthesisUtterance(text);
            msg.pitch = pitch;
            msg.rate = rate;
            msg.volume = 1.0;
            if(cachedVoices.length === 0) cachedVoices = window.speechSynthesis.getVoices();
            let voice = cachedVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Google US English') || v.name.includes('Male'))) || cachedVoices[0];
            if(voice) msg.voice = voice;
            window.speechSynthesis.speak(msg);
        }

        let lastBossSpeakTime = 0;
        function speakBoss(text) {
            if (isMuted || !('speechSynthesis' in window)) return;
            let now = Date.now();
            if (now - lastBossSpeakTime < 800) return;
            
            lastBossSpeakTime = now;
            
            let msg = new SpeechSynthesisUtterance(text);
            msg.pitch = 0.05;
            msg.rate = 0.8;
            msg.volume = 1.0;
            if(cachedVoices.length === 0) cachedVoices = window.speechSynthesis.getVoices();
            let voice = cachedVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Google UK English Male') || v.name.includes('Male') || v.name.includes('Kore'))) || cachedVoices[0];
            if(voice) msg.voice = voice;
            window.speechSynthesis.speak(msg);
        }

        function playTitleTheme() {
            if (mainBgmInterval) { clearInterval(mainBgmInterval); mainBgmInterval = null; }
            if (starBgmInterval) { clearInterval(starBgmInterval); starBgmInterval = null; }
            if(!audioCtx) initAudio();
            const loop = () => {
                if (!audioCtx) return;
                const notes = [{f: 440, d: 0.72}, {f: 523.25, d: 0.72}, {f: 659.25, d: 1.46}, {f: 440, d: 0.72}, {f: 523.25, d: 0.72}, {f: 659.25, d: 1.46}, {f: 659.25, d: 0.72}, {f: 783.99, d: 0.72}, {f: 880, d: 1.46}, {f: 523.25, d: 0.72}, {f: 587.33, d: 0.72}, {f: 659.25, d: 1.46}];
                let time = audioCtx.currentTime + 0.1;
                notes.forEach(n => { playOcarinaNote(n.f, time, n.d, 0.05); time += n.d + 0.05; });
            };
            loop();
            mainBgmInterval = setInterval(loop, 10450);
        }

        function playStarTheme() {
            if (mainBgmInterval) { clearInterval(mainBgmInterval); mainBgmInterval = null; }
            if (starBgmInterval) { clearInterval(starBgmInterval); starBgmInterval = null; }
            if(!audioCtx) initAudio();
            const loop = () => {
                if (!audioCtx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
                let time = audioCtx.currentTime + 0.1;
                notes.forEach((freq) => { playSynth('square', freq, 0.1, 0, 0.08); time += 0.15; });
            };
            loop();
            starBgmInterval = setInterval(loop, 900);
        }

        function stopStarTheme() {
            if (starBgmInterval) { clearInterval(starBgmInterval); starBgmInterval = null; }
            playTitleTheme();
        }

        function playJump() { playSynth('square', 350, 0.2, 200, 0.15); }
        function playDoubleJump() { playSynth('square', 500, 0.2, 300, 0.15); }
        function playDamage() { playSynth('sawtooth', 150, 0.2, -100, 0.25); }
        function playClink() { playSynth('triangle', 800, 0.1, 0, 0.15); }
        function playPowerup() { playSynth('square', 400, 0.5, 400, 0.2); }
        function playGrrr() { playSynth('sawtooth', 80, 0.8, -50, 0.3); }
        function playHahaha() { if (!audioCtx) return; let t = audioCtx.currentTime; [0, 0.2, 0.4].forEach(d => { playOcarinaNote(350, t + d, 0.15, 0.4); }); }
        function playThunder() { playSynth('square', 50, 1.5, -30, 0.2); setTimeout(() => playSynth('sawtooth', 40, 1.0, -20, 0.15), 200); }
        
        function playHeart() { 
            if(isMuted) return;
            if(!audioCtx) initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            playSynth('square', 330, 0.1, 0, 0.2);
            setTimeout(() => playSynth('square', 440, 0.1, 0, 0.2), 100);
            setTimeout(() => playSynth('square', 554, 0.1, 0, 0.2), 200);
            setTimeout(() => playSynth('square', 659, 0.3, 0, 0.2), 300);
        }

        function playDelicious() { playSynth('square', 300, 0.3, 100, 0.2); speakVoice("Delicious!", 0.1, 1.0); }
        function playImPowerful() { playSynth('sawtooth', 220, 0.6, 200, 0.3); speakVoice("I'm powerful!", 1.0, 1.0); }
        function playPogoPower() { playSynth('sawtooth', 300, 0.4, 200, 0.3); speakVoice("Pogo Power!!!", 0.1, 1.0); }
        function playImInvincible() { playSynth('square', 440, 0.5, 300, 0.35); speakVoice("I'm invincible!", 0.1, 1.0); }
        function playLoveMath() { playSynth('square', 400, 0.2, 100, 0.2); speakVoice("I love Math!!", 0.1, 1.0); }
        function playNeedPractice() { playSynth('sawtooth', 150, 0.3, -50, 0.2); speakVoice("I need to practise!!", 0.1, 1.0); }
        function playThatsRight() { playSynth('square', 300, 0.15, 200, 0.2); speakVoice("That's right!!", 0.1, 1.0); }
        function playThatsWrong() { playSynth('sawtooth', 140, 0.25, -50, 0.25); speakVoice("That's Wrong!!", 0.1, 1.0); }
        function playBonzai() { playSynth('square', 300, 0.15, 200, 0.2); speakVoice("Baaaaaaanzaaaaaiiiii!!!", 1.0, 0.4); }
        function playOoohYeah() { playSynth('square', 200, 0.4, -100, 0.3); setTimeout(() => playSynth('square', 100, 0.6, 200, 0.3), 400); speakVoice("OOOOOH YEAH!!", 0.1, 1.0); }
        function playMachoYeah() { playSynth('square', 300, 0.15, 200, 0.2); speakVoice("Oooh Yeah!!", 0.1, 1.0); }
        function playNoWay() { playSynth('sawtooth', 140, 0.25, -50, 0.25); speakVoice("No Way!!", 0.1, 1.0); }

        document.getElementById('btn-music').onclick = function(e) {
            this.blur(); isMuted = !isMuted;
            this.innerText = isMuted ? '🔇 MUSIC OFF' : '🔊 MUSIC ON';
            this.style.borderColor = isMuted ? '#ef4444' : '#38bdf8';
            if(!audioCtx) initAudio();
            if(masterGain) masterGain.gain.value = isMuted ? 0 : 1;
            if (!isMuted) playTitleTheme(); 
            else { if(mainBgmInterval) clearInterval(mainBgmInterval); if(starBgmInterval) clearInterval(starBgmInterval); }
        };

        document.getElementById('btn-fullscreen').onclick = function(e) {
            this.blur(); const wrap = document.getElementById('game-wrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) { 
                if(wrap.requestFullscreen) { wrap.requestFullscreen().catch(err => console.log("Fullscreen blocked")); }

        function initPhaser() {
            window.storeBank = [];
            for(let i=0; i<30; i++) {
                let cost = (Math.random() * 18.50 + 0.50);
                cost = Math.floor(cost * 4) / 4; 
                if (i%2 === 0) cost = Math.floor((Math.random()*18+1)*10)/10; 
                let costStr = cost.toFixed(2);
                let change = (20.00 - cost).toFixed(2);
                let wrong1 = (parseFloat(change) + 1.00).toFixed(2);
                let wrong2 = (parseFloat(change) - 0.10).toFixed(2);
                window.storeBank.push({
                    q: `If an item costs $${costStr} and you purchase it using a $20 bill, what would your change be?`,
                    a: `$${change}`, options: [`$${change}`, `$${wrong1}`, `$${wrong2}`]
                });
            }
            for(let i=0; i<30; i++) {
                let cents = [15, 30, 45, 60, 75, 80, 90, 35, 40, 65, 85, 95][i % 12] || (Math.floor(Math.random()*18 + 1)*5);
                let valStr = (cents / 100).toFixed(2);
                let q = Math.floor(cents / 25); let r = cents % 25;
                let d = Math.floor(r / 10); r = r % 10;
                let n = Math.floor(r / 5);
                
                let build = (q,d,n) => {
                    let pts=[];
                    if(q) pts.push(`${q} quarter${q>1?'s':''}`);
                    if(d) pts.push(`${d} dime${d>1?'s':''}`);
                    if(n) pts.push(`${n} nickel${n>1?'s':''}`);
                    return pts.join(" and ") || "No change";
                };
                let a = build(q,d,n); let w1 = build(Math.max(0,q-1), d+2, n+1); let w2 = build(q, Math.max(0,d-1), n+2);
                if (q===0) w1 = build(q, d, n+3);
                if (d===0) w2 = build(q, d+1, Math.max(0,n-2));
                if (a===w1) w1 = build(q+1, d, n);
                if (a===w2) w2 = build(q, d+1, n);
                
                window.storeBank.push({
                    q: `What's the most efficient way to give change of $${valStr}?`,
                    a: a, options: [a, w1, w2]
                });
            }
