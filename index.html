                buildWorldLevel() {
                    const floorY = 480; let keySuffix = this.currentWorld;
                    let foeCounts = [25, 35, 45, 55, 65, 75, 85]; let maxFoes = foeCounts[this.currentWorld - 1];
                    let startX = (this.currentWorld === 1) ? 5200 : 32;

                    if (!this.levelLength) this.levelLength = startX + Math.max(3000, maxFoes * 500 + 1000);
                    let numPlatforms = Math.ceil((this.levelLength - startX) / 64);

                    let bonsaiMilestones = [
                        Math.floor(numPlatforms * 0.15),
                        Math.floor(numPlatforms * 0.35),
                        Math.floor(numPlatforms * 0.55),
                        Math.floor(numPlatforms * 0.75),
                        Math.floor(numPlatforms * 0.90)
                    ];
                    let pogoMilestones = [
                        Math.floor(numPlatforms * 0.25),
                        Math.floor(numPlatforms * 0.65),
                        Math.floor(numPlatforms * 0.85)
                    ];
                    let lightningMilestone = Math.max(10, Math.floor((numPlatforms * 0.50) / 10) * 10);

                    if (this.currentWorld > 1) {
                        this.storeBuilding = this.physics.add.staticSprite(startX + 180, floorY - 64, 'store_building');
                    }

                    for(let i=0; i<numPlatforms; i++) {
                        let px = startX + i*64;
                        let isPit = (i > 10 && i < numPlatforms - 15 && (i % 12 === 0 || i % 12 === 1)); 
                        if (!isPit) this.platforms.create(px, floorY, `platform_${keySuffix}`);

                        let hasMidPlatform = (i % 8 >= 4 && i > 5 && i < numPlatforms - 10);
                        if (hasMidPlatform) this.platforms.create(px, floorY - 140, `platform_${keySuffix}`);
                        
                        let hasHighPlatform = (i % 12 >= 9 && i > 10 && i < numPlatforms - 10);
                        if (hasHighPlatform) {
                            this.platforms.create(px, floorY - 280, `platform_${keySuffix}`);
                            if (i % 24 === 0) this.spawnItem(px, floorY - 280 + 32, 'gem'); 
                        }
                        
                        let isBossArena = px > this.levelLength - 800;
                        if (isBossArena && !isPit && i < numPlatforms - 2) {
                            if (i % 5 === 0) {
                                this.platforms.create(px, floorY - 140, `platform_${keySuffix}`);
                                this.platforms.create(px + 64, floorY - 140, `platform_${keySuffix}`);
                            }
                        }
                        
                        if (i > 10 && i < numPlatforms - 5 && !isBossArena) {
                            if (hasHighPlatform && Math.random() < 0.25) {
                                let r = Math.random();
                                if (r < 0.20) { this.spawnBirdFoe(px, floorY - 340 - 60); } 
                                else if (r < 0.40) { this.spawnMathFoe(px, 10, false, false, true); } 
                                else if (r < 0.55) { this.spawnWormFoe(px, floorY - 340); }
                                else if (r < 0.70) { this.spawnMathFoe(px, floorY - 340, false, true, false); } 
                                else if (r < 0.85) { this.spawnMathFoe(px, floorY - 340 - 80, true, false, false); } 
                                else { this.spawnMathFoe(px, floorY - 340, false, false, false); }
                            }
                            if (hasMidPlatform && Math.random() < 0.25) {
                                let r = Math.random();
                                if (r < 0.20) { this.spawnBirdFoe(px, floorY - 200 - 60); } 
                                else if (r < 0.40) { this.spawnMathFoe(px, 10, false, false, true); } 
                                else if (r < 0.55) { this.spawnWormFoe(px, floorY - 200); }
                                else if (r < 0.70) { this.spawnMathFoe(px, floorY - 200, false, true, false); } 
                                else if (r < 0.85) { this.spawnMathFoe(px, floorY - 200 - 80, true, false, false); } 
                                else { this.spawnMathFoe(px, floorY - 200, false, false, false); }
                            }
                        }
                        
                        let hasFloorFoe = (i % 6 === 0 && !isPit && !hasMidPlatform && !hasHighPlatform && i > 10 && i < numPlatforms - 10 && !isBossArena);
                        if (hasFloorFoe && Math.random() < 0.35) {
                            let rx = px + 32; let r = Math.random();
                            if (r < 0.3) this.spawnWormFoe(rx, floorY);
                            else if (r < 0.7) this.spawnMathFoe(rx, floorY - 40, false, Math.random() < 0.4, false);
                            else this.spawnMathFoe(rx, floorY - 40, true, false, false); 
                        }
                        
                        if (this.currentWorld === 7 && i % 10 === 0 && !isPit && i > 5 && i < numPlatforms - 10) {
                            let lamp = this.lamps.create(px, floorY - 340, 'lamp');
                            lamp.setDepth(45);
                        }

                        if (i > 10 && i % 10 === 0 && !isPit && !isBossArena) {
                            let blockY = hasMidPlatform ? floorY - 200 : floorY - 64;
                            let blk = this.blocks.create(px, blockY, `block_${keySuffix}`);
                            if (bonsaiMilestones.includes(i)) blk.fixedItem = 'bonsai'; 
                            else if (pogoMilestones.includes(i)) blk.fixedItem = 'pogo';
                            else if (i === lightningMilestone) blk.fixedItem = 'lightning_bolt'; 
                        }
                        
                        if (this.currentWorld === 1 && i === Math.floor(numPlatforms/2)) this.spawnItem(px, floorY - 200, 'pizza'); 
                        if (i === numPlatforms - 10) this.spawnItem(px, floorY - 200, 'heart'); 
                    }

                    let halfPlatformIdx = Math.floor(numPlatforms / 2);
                    while((halfPlatformIdx > 10 && halfPlatformIdx < numPlatforms - 15 && (halfPlatformIdx % 12 === 0 || halfPlatformIdx % 12 === 1))) { halfPlatformIdx++; }
                    this.halfwayX = startX + halfPlatformIdx * 64;
                    this.add.image(this.halfwayX, floorY - 32, 'signpost');
                    
                    this.passedCheckpoint = (this.checkpointX > 0);
                    this.spawnBoss(this.levelLength - 400, floorY - 100);
                }

                update(time, delta) {
                    if (!this.sys || !this.sys.isActive()) return;

                    if (Phaser.Input.Keyboard.JustDown(this.keys.pause) && !this.isShopping && !this.isAnswering) {
                        this.isPaused = !this.isPaused;
                        if(this.isPaused) { this.physics.pause(); if(this.pauseText) this.pauseText.setVisible(true); } 
                        else { this.physics.resume(); if(this.pauseText) this.pauseText.setVisible(false); }
                    }
                    
                    if (this.isWinning) {
                        return;
                    }
                    
                    if(this.isPaused || this.isDead || this.isAnswering || this.isShopping) return;

                    if (this.storeBuilding && Math.abs(this.player.x - this.storeBuilding.x) < 50 && this.player.y > 350) {
                        if (!this.storePromptText) {
                            this.storePromptText = this.add.text(this.storeBuilding.x, this.storeBuilding.y - 80, "Press UP for Shop", { fontFamily: titleFont, fontSize: '24px', color: '#facc15', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(200);
                        }
                        if (Phaser.Input.Keyboard.JustDown(this.keys.up)) {
                            this.openStore();
                        }
                    } else if (this.storePromptText) {
                        this.storePromptText.destroy(); this.storePromptText = null;
                    }

                    if(this.bgM) this.bgM.tilePositionX = this.cameras.main.scrollX * 0.2;
                    if(this.bgF) this.bgF.tilePositionX = this.cameras.main.scrollX * 0.5;
                    
                    // NEW BOSS MOVEMENT LOGIC
                    if (this.boss && this.boss.active && this.bossEngaged && !this.isDead && !this.isWinning) {
                        
                        if (!this.boss.stateTimer) {
                            this.boss.stateTimer = 0;
                            this.boss.bossState = 'avoid';
                        }
                        this.boss.stateTimer += delta;

                        if (this.boss.stateTimer > 3500) { // Change pattern every 3.5 seconds
                            this.boss.stateTimer = 0;
                            let rand = Math.random();
                            
                            if (this.currentWorld === 7 && rand < 0.35) { // Final boss jumps!
                                this.boss.bossState = 'jump';
                                this.boss.jumpTargetX = this.player.x;
                                this.boss.body.allowGravity = true;
                                this.boss.body.setVelocityY(-900);
                            } else if (rand < 0.3) {
                                this.boss.bossState = 'chase';
                            } else if (rand < 0.6) {
                                this.boss.bossState = 'sweep';
                                this.boss.sweepTargetX = Math.random() > 0.5 ? this.levelLength - 100 : this.levelLength - 700;
                                this.boss.sweepTargetY = Math.random() * 250 + 100;
                            } else {
                                this.boss.bossState = 'avoid';
                            }
                        }

                        let targetX = this.boss.x;
                        let targetY = this.boss.y;

                        if (this.boss.bossState === 'jump' && this.currentWorld === 7) {
                            targetX = this.boss.jumpTargetX;
                            this.boss.body.setVelocityX((targetX - this.boss.x) * 1.5);
                            
                            // Check landing condition
                            if (this.boss.body.velocity.y > 0 && this.boss.y > 300) {
                                this.boss.y = 300;
                                this.boss.body.allowGravity = false;
                                this.boss.body.setVelocityY(0);
                                this.boss.bossState = 'avoid';
                                this.boss.stateTimer = 0;
                                
                                this.cameras.main.shake(300, 0.02);
                                playThunder(); // Acts as a heavy slam/thud noise
                            }
                        } else {
                            if (this.boss.body.allowGravity) {
                                this.boss.body.allowGravity = false;
                            }
                            
                            if (this.boss.bossState === 'chase') {
                                targetX = this.player.x;
                                targetY = this.player.y - 50; 
                            } else if (this.boss.bossState === 'sweep') {
                                targetX = this.boss.sweepTargetX;
                                targetY = this.boss.sweepTargetY;
                            } else { // default 'avoid'
                                targetX = (this.levelLength - 400) + ( (this.levelLength - 400) - this.player.x ) * 0.4;
                                targetY = 250 + ( 300 - this.player.y ) * 0.4;
                            }

                            targetX = Phaser.Math.Clamp(targetX, this.levelLength - 750, this.levelLength - 50);
                            targetY = Phaser.Math.Clamp(targetY, 50, 420);

                            this.boss.body.setVelocityX((targetX - this.boss.x) * 2);
                            this.boss.body.setVelocityY((targetY - this.boss.y) * 2);
                        }
                        
                        if (this.bossText) {
                            this.bossText.x = this.boss.x;
                            this.bossText.y = this.boss.y - (this.currentWorld === 7 ? 160 : 100);
                        }
                    }
                    
                    if (!this.bossEngaged && this.player.x > this.levelLength - 700) {
                        this.bossEngaged = true;
                        let arenaStartX = this.levelLength - 800;
                        this.physics.world.setBounds(arenaStartX, 0, 800, 540, true, true, true, false);
                        this.cameras.main.setBounds(arenaStartX, 0, 800, 540);
                        for(let y=0; y<540; y+=64) {
                            let blockVisual = this.add.image(arenaStartX + 32, y + 32, `block_${this.currentWorld}`);
                            blockVisual.setDepth(20);
                        }
                        this.enemies.getChildren().forEach(foe => {
                            if (!foe.isBoss) {
                                this.destroyFoeCleanly(foe, false);
                            }
                        });
                    }
                    
                    this.handlePlayerLogic(time, delta);
                    
                    if (this.currentWorld === 7 && this.darknessOverlay) {
                        if (this.lightPhase === 'fading_off') this.darknessOverlay.alpha = Phaser.Math.Clamp(this.darknessOverlay.alpha + (delta / 5000) * 0.9, 0, 0.85);
                        else if (this.lightPhase === 'fading_on') this.darknessOverlay.alpha = Phaser.Math.Clamp(this.darknessOverlay.alpha - (delta / 5000) * 0.9, 0, 0.85);
                        else if (this.lightPhase === 'off') this.darknessOverlay.alpha = 0.85;
                        else if (this.lightPhase === 'on') this.darknessOverlay.alpha = 0;

                        let underLamp = false;
                        this.lamps.getChildren().forEach(lamp => {
                            if (Math.abs(this.player.x - lamp.x) < 80 && this.player.y > lamp.y && this.player.y < lamp.y + 300) {
                                underLamp = true;
                            }
                        });

                        if (underLamp || this.player.isInvincible) {
                            this.player.setDepth(45);
                            if (this.pogoAura) this.pogoAura.setDepth(44);
                            if (this.lightningAura) this.lightningAura.setDepth(44);
                            if (this.chargeG) this.chargeG.setDepth(46);
                        } else {
                            this.player.setDepth(10);
                            if (this.pogoAura) this.pogoAura.setDepth(9);
                            if (this.lightningAura) this.lightningAura.setDepth(9);
                            if (this.chargeG) this.chargeG.setDepth(11);
                        }
                    }

                    if (!this.passedCheckpoint && this.halfwayX && this.player.x >= this.halfwayX) {
                        this.passedCheckpoint = true;
                        let msg = this.add.text(480, 150, "You're 1/2 Way There!", { fontFamily: titleFont, fontSize: '40px', color: '#facc15', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setScrollFactor(0).setDepth(100);
                        this.tweens.add({ targets: msg, y: 100, alpha: 0, duration: 3000, onComplete: () => msg.destroy() });
                        playPowerup();
                    }

                    if(this.bossBalls) {
                        this.bossBalls.getChildren().forEach(ball => {
                            if(ball && ball.active) {
                                if (ball.mathText && ball.mathText.scene) {
                                    ball.mathText.x = ball.x; ball.mathText.y = ball.y - 40;
                                }
                                if (ball.y > 1000) {
                                    if (ball.mathText) ball.mathText.destroy();
                                    ball.destroy();
                                }
                            }
                        });
                    }
                    
                    this.enemies.getChildren().forEach(foe => {
                        if(foe && foe.active) {
                            if(foe.isFlashing) foe.setTint(Phaser.Display.Color.HSVToRGB((time%1000)/1000, 1, 1).color);
                            if(foe.mathText && foe.mathText.scene) { foe.mathText.x = foe.x; foe.mathText.y = Phaser.Math.Clamp(foe.y - (foe.isGiant ? 110 : 50), this.cameras.main.scrollY + 35, 540); }
                            
                            if (foe.isChute) {
                                if (foe.body.blocked.down || foe.body.touching.down) {
                                    foe.isChute = false; foe.body.setMaxVelocityY(1200); 
                                    foe.setTexture(`foe_${Math.floor(Math.random() * 6) + 1}`);
                                    foe.body.setSize(36, 40); foe.body.setOffset(6, 16);
                                    foe.body.setVelocityX(Math.random() > 0.5 ? 50 : -50);
                                }
                            }

                            if (foe.isWorm) {
                                let closest = this.physics.closest(foe, this.platforms.getChildren());
                                if (!foe.lastTransitionTime) foe.lastTransitionTime = 0;
                                if (closest && closest.y < 450 && Phaser.Math.Distance.Between(foe.x, foe.y, closest.x, closest.y) <= 80) {
                                    let dx = foe.x - closest.x; let dy = foe.y - closest.y; let mag = 1200; let gx=0, gy=0, rot=0, face='top';
                                    if (Math.abs(dx) > Math.abs(dy)) {
                                        if (dx > 0) { gx = -mag; gy = 0; rot = Math.PI/2; face = 'right'; }
                                        else { gx = mag; gy = 0; rot = -Math.PI/2; face = 'left'; }
                                    } else {
                                        if (dy > 0) { gx = 0; gy = -mag; rot = Math.PI; face = 'bottom'; }
                                        else { gx = 0; gy = mag; rot = 0; face = 'top'; }
                                    }
                                    if (foe.lastFace !== face && time - foe.lastTransitionTime > 400) {
                                        foe.body.gravity.x = gx; foe.body.gravity.y = gy; foe.setRotation(rot);
                                        if (face === 'top' || face === 'bottom') foe.setVelocityY(0);
                                        if (face === 'left' || face === 'right') foe.setVelocityX(0);
                                        foe.lastFace = face; foe.lastTransitionTime = time;
                                    }
                                    let speed = 80; let currentFace = foe.lastFace || 'top';
                                    if (currentFace === 'top') { foe.setVelocityX(speed); foe.setVelocityY(0); }
                                    else if (currentFace === 'right') { foe.setVelocityY(speed); foe.setVelocityX(0); }
                                    else if (currentFace === 'bottom') { foe.setVelocityX(-speed); foe.setVelocityY(0); }
                                    else if (currentFace === 'left') { foe.setVelocityY(-speed); foe.setVelocityX(0); }
                                } else {
                                    foe.body.gravity.x = 0; foe.body.gravity.y = 1200; foe.setRotation(0); foe.setVelocityX(-40); 
                                }
                            }
                            else if(foe.isBird) { 
                                if (foe.x < this.cameras.main.scrollX - 200 || foe.x > this.cameras.main.scrollX + 1200) {
                                    if(foe.mathText) foe.mathText.destroy(); if(foe.hpBarBg) foe.hpBarBg.destroy(); if(foe.hpBar) foe.hpBar.destroy(); foe.destroy();
                                }
                            } 
                            else if (!foe.isBoss) {
                                if (foe.body.blocked.down && !foe.isChute) {
                                    let checkX = foe.x + (foe.body.velocity.x > 0 ? 32 : -32); let hasTile = false; let wallHit = foe.body.blocked.left || foe.body.blocked.right;
                                    this.platforms.getChildren().forEach(p => { if (Math.abs(p.x - checkX) < 32 && Math.abs(p.y - (foe.y + foe.body.height/2 + 20)) < 40) hasTile = true; });
                                    if (!hasTile || wallHit) { 
                                        if (Math.random() < 0.40 && !foe.isGiant) foe.body.setVelocityY(-550); 
                                        else { foe.body.setVelocityX(-foe.body.velocity.x); foe.setFlipX(foe.body.velocity.x > 0); }
                                    }
                                }
                                if (!foe.isChute && Math.abs(foe.body.velocity.x) < 10) foe.body.setVelocityX(foe.flipX ? 50 : -50); 
                            }
                            
                            if(foe.hpBarBg && foe.hpBarBg.scene) { foe.hpBarBg.x = foe.x; foe.hpBarBg.y = foe.y; }
                            if(foe.hpBar && foe.hpBar.scene) { foe.hpBar.x = foe.x; foe.hpBar.y = foe.y; }
                            if (foe.y > 1000) this.destroyFoeCleanly(foe, false); 
                        }
                    });

                    if(this.player && this.player.y > 1000) this.die();
                }
                
                openStore() {
                    this.isShopping = true;
                    this.physics.pause();
                    this.shopBg = this.add.rectangle(480, 270, 960, 540, 0x000000, 0.9).setScrollFactor(0).setDepth(300).setInteractive();
                    this.shopUI = this.add.container(0, 0).setScrollFactor(0).setDepth(301);

                    let title = this.add.text(480, 50, "UPGRADE STORE", {fontFamily: titleFont, fontSize: '50px', color: '#facc15'}).setOrigin(0.5);
                    this.shopBalText = this.add.text(480, 100, `Your Balance: $${window.gameStats.money.toFixed(2)}`, {fontFamily: kidFont, fontSize: '30px', color: '#4ade80'}).setOrigin(0.5);
                    this.shopUI.add([title, this.shopBalText]);

                    const items = [
                        {name: "3 Extra Hearts (Temp)", price: 1.50, id: 'hearts'},
                        {name: "1 Min Invincibility (Temp)", price: 0.90, id: 'invinc'},
                        {name: "Teddy Bear Fireballs (Temp)", price: 3.25, id: 'teddy'},
                        {name: "Karate Outfit (Perm)", price: 7.75, id: 'karate'},
                        {name: "Macho Sunglasses (Perm)", price: 12.50, id: 'macho'},
                        {name: "Levitate Power (Perm)", price: 16.50, id: 'levitate'}
                    ];

                    items.forEach((item, i) => {
                        let x = 240 + (i % 2) * 480;
                        let y = 180 + Math.floor(i / 2) * 100;
                        
                        let isPurchased = (item.id === 'karate' && window.unlockedKarate) ||
                                          (item.id === 'macho' && window.unlockedMacho) ||
                                          (item.id === 'levitate' && window.unlockedLevitate) ||
                                          (item.id === 'teddy' && window.tempUpgrades.teddyBears) ||
                                          (item.id === 'hearts' && window.tempUpgrades.hearts) ||
                                          (item.id === 'invinc' && window.tempUpgrades.invincibility);

                        let btn = this.add.rectangle(x, y, 420, 80, 0x1e293b);
                        if (!isPurchased) {
                            btn.setInteractive();
                            btn.setStrokeStyle(2, 0x38bdf8);
                            btn.on('pointerdown', () => this.buyItem(item));
                        } else {
                            btn.setStrokeStyle(2, 0x64748b);
                        }
                        
                        let txt = this.add.text(x, y, `${item.name}\n$${item.price.toFixed(2)}`, {fontFamily: kidFont, fontSize: '22px', color: isPurchased ? '#64748b' : '#fff', align: 'center'}).setOrigin(0.5);
                        this.shopUI.add([btn, txt]);

                        if (isPurchased) {
                            let banner = this.add.rectangle(x, y, 400, 25, 0xef4444).setAngle(-5);
                            let bannerTxt = this.add.text(x, y, "PURCHASED", {fontFamily: titleFont, fontSize: '22px', color: '#fff'}).setOrigin(0.5).setAngle(-5);
                            this.shopUI.add([banner, bannerTxt]);
                        }
                    });

                    let closeBtn = this.add.text(480, 480, "[ CLOSE STORE ]", {fontFamily: titleFont, fontSize: '28px', backgroundColor: '#ef4444', padding: 10, color:'#fff'}).setOrigin(0.5).setInteractive();
                    closeBtn.on('pointerdown', () => this.closeStore());
                    this.shopUI.add(closeBtn);
                }

                buyItem(item) {
                    if (window.gameStats.money < item.price) {
                        playThatsWrong();
                        let warn = this.add.text(480, 140, "Not enough money!", {fontFamily: titleFont, fontSize: '24px', color: '#ef4444', stroke: '#000', strokeThickness:3}).setOrigin(0.5).setDepth(302).setScrollFactor(0);
                        this.time.delayedCall(1500, () => warn.destroy());
                        return;
                    }
                    this.shopUI.setVisible(false);
                    this.showShopQuestion(item);
                }

                showShopQuestion(item) {
                    let qData = Phaser.Utils.Array.GetRandom(window.storeBank);
                    this.shopQContainer = this.add.container(0, 0).setScrollFactor(0).setDepth(310);

                    let box = this.add.rectangle(480, 270, 800, 400, 0x0f172a).setStrokeStyle(4, 0xfacc15).setInteractive();
                    let qText = this.add.text(480, 150, qData.q, {fontFamily: kidFont, fontSize: '28px', color: '#fff', align: 'center', wordWrap: {width: 700}}).setOrigin(0.5);
                    this.shopQContainer.add([box, qText]);

                    let opts = Phaser.Utils.Array.Shuffle([...qData.options]);
                    opts.forEach((opt, i) => {
                        let y = 250 + i * 70;
                        let btn = this.add.rectangle(480, y, 600, 50, 0x1e293b).setInteractive().setStrokeStyle(2, 0x38bdf8);
                        let txt = this.add.text(480, y, opt, {fontFamily: kidFont, fontSize: '22px', color: '#fff'}).setOrigin(0.5);
                        btn.on('pointerdown', () => {
                            if (opt === qData.a) {
                                playPowerup();
                                window.gameStats.money -= item.price;
                                this.grantUpgrade(item.id);
                                this.shopQContainer.destroy();
                                this.closeStore();
                            } else {
                                playThatsWrong();
                                this.shopQContainer.destroy();
                                this.closeStore();
                            }
                        });
                        this.shopQContainer.add([btn, txt]);
                    });
                }

                grantUpgrade(id) {
                    if (id === 'hearts') {
                        window.tempUpgrades.hearts = true;
                        this.maxHealth = 8;
                        this.health = Math.min(8, this.health + 3);
                        this.updateHUD();
                    } else if (id === 'invinc') {
                        window.tempUpgrades.invincibility = true;
                        this.player.isInvincible = true;
                        this.player.setTint(0xffaa00);
                        this.time.delayedCall(60000, () => {
                            window.tempUpgrades.invincibility = false;
                            if(this.player && this.player.active) {
                                this.player.isInvincible = false;
                                this.player.clearTint();
                            }
                        });
                    } else if (id === 'teddy') {
                        window.tempUpgrades.teddyBears = true;
                    } else if (id === 'karate') {
                        window.unlockedKarate = true;
                        globalOutfit = 'karate';
                        this.refreshPlayerTexture();
                    } else if (id === 'macho') {
                        window.unlockedMacho = true;
                        globalGlasses = 'macho';
                        this.refreshPlayerTexture();
                    } else if (id === 'levitate') {
                        window.unlockedLevitate = true;
                        globalPower = 'levitate';
                    }
                    if (this.moneyText) this.moneyText.setText('MONEY: $' + window.gameStats.money.toFixed(2));
                    if (window.saveGameData) window.saveGameData();
                }

                closeStore() {
                    if (this.shopBg) this.shopBg.destroy();
                    if (this.shopUI) this.shopUI.destroy();
                    if (this.shopQContainer) this.shopQContainer.destroy();
                    this.isShopping = false;
                    this.physics.resume();
                }

                updateFoeHP(foe) {
                    if (!foe || !foe.scene || !foe.hpBarBg || !foe.hpBar || foe.hp === undefined) return;
                    let w = 40; let h = 6; let offsetX = foe.isGiant ? -20 : -20; let offsetY = foe.isGiant ? -60 : -35;
                    
                    foe.hpBarBg.clear(); foe.hpBarBg.fillStyle(0x000000, 0.8); foe.hpBarBg.fillRect(offsetX, offsetY, w, h);
                    
                    let maxHp = foe.isGiant ? 6 : 3; let hpPct = Math.max(0, foe.hp / maxHp);
                    foe.hpBar.clear();
                    if (hpPct > 0.6) foe.hpBar.fillStyle(0x22c55e, 1);
                    else if (hpPct > 0.3) foe.hpBar.fillStyle(0xfacc15, 1);
                    else foe.hpBar.fillStyle(0xef4444, 1);
                    foe.hpBar.fillRect(offsetX, offsetY, w * hpPct, h);
                }

                handlePlayerLogic(time, delta) {
                    if(!this.player || !this.player.body) return;

                    if (this.isStunned) {
                        this.player.setVelocity(0, 0); this.player.play('handsup_player', true); return;
                    }
                    
                    let gx = 0; let gy = 1200; let rot = 0; let face = 'top';
                    const jumpJustDown = Phaser.Input.Keyboard.JustDown(this.keys.jump) || Phaser.Input.Keyboard.JustDown(this.keys.jumpAlt);
                    
                    let onGround = false;
                    if (this.player.body.gravity.y > 0) onGround = this.player.body.blocked.down || this.player.body.touching.down;
                    else if (this.player.body.gravity.y < 0) onGround = this.player.body.blocked.up || this.player.body.touching.up;
                    else if (this.player.body.gravity.x > 0) onGround = this.player.body.blocked.right || this.player.body.touching.right;
                    else if (this.player.body.gravity.x < 0) onGround = this.player.body.blocked.left || this.player.body.touching.left;

                    if ((globalPower === 'levitate' || window.tempUpgrades.levitate) && this.keys.up.isDown) {
                        this.player.body.gravity.y = 0;
                        this.player.setVelocityY(-150);
                        this.isBonsaiJumping = true; 
                        gy = 0;
                    }

                    if (jumpJustDown) {
                        if (this.cursors.down.isDown && onGround && this.player.y < 420) {
                            this.isDroppingThrough = true;
                            this.time.delayedCall(300, () => { this.isDroppingThrough = false; });
                            
                            if (this.hasBonsai) {
                                this.hasBonsai = false;
                                this.currentGravityFace = 'top';
                                this.currentGravity = {x: 0, y: 1200, rot: 0, face: 'top'};
                                this.player.body.gravity.x = 0;
                                this.player.body.gravity.y = 1200;
                                this.player.setRotation(0);
                            }
                            return; 
                        }
                        
                        this.isBonsaiJumping = true; 
                    }
                    
                    if (this.hasBonsai && !this.isBonsaiJumping) {
                        let closest = this.physics.closest(this.player, this.platforms.getChildren());
                        if (closest && closest.y < 450 && Phaser.Math.Distance.Between(this.player.x, this.player.y, closest.x, closest.y) < 110) {
                            let dx = this.player.x - closest.x; let dy = this.player.y - closest.y;
                            let currentFace = this.currentGravityFace || 'top'; let newFace = currentFace;

                            if (currentFace === 'top') { if (dx > 32) newFace = 'right'; else if (dx < -32) newFace = 'left'; } 
                            else if (currentFace === 'bottom') { if (dx > 32) newFace = 'right'; else if (dx < -32) newFace = 'left'; } 
                            else if (currentFace === 'left') { if (dy > 32) newFace = 'bottom'; else if (dy < -32) newFace = 'top'; } 
                            else if (currentFace === 'right') { if (dy > 32) newFace = 'bottom'; else if (dy < -32) newFace = 'top'; }

                            if (this.isBonsaiJumping) {
                                if (Math.abs(dx) > Math.abs(dy)) newFace = dx > 0 ? 'right' : 'left';
                                else newFace = dy > 0 ? 'bottom' : 'top';
                            }
                            
                            let mag = 1200; 
                            if (newFace === 'top') { gx = 0; gy = mag; rot = 0; face = 'top'; }
                            else if (newFace === 'bottom') { gx = 0; gy = -mag; rot = Math.PI; face = 'bottom'; }
                            else if (newFace === 'left') { gx = mag; gy = 0; rot = -Math.PI/2; face = 'left'; }
                            else if (newFace === 'right') { gx = -mag; gy = 0; rot = Math.PI/2; face = 'right'; }

                            this.currentGravity = {x: gx, y: gy, rot: rot, face: face};
                        } else {
                            this.currentGravity = {x: 0, y: 1200, rot: 0, face: 'top'};
                        }
                    } else if (!((globalPower === 'levitate' || window.tempUpgrades.levitate) && this.keys.up.isDown)) {
                        this.currentGravity = {x: 0, y: 1200, rot: 0, face: 'top'};
                    }

                    if (this.currentGravityFace !== this.currentGravity.face && !((globalPower === 'levitate' || window.tempUpgrades.levitate) && this.keys.up.isDown)) {
                        let oldFace = this.currentGravityFace; let newFace = this.currentGravity.face;
                        let speed = 0;
                        if (oldFace === 'top') speed = this.player.body.velocity.x;
                        else if (oldFace === 'bottom') speed = -this.player.body.velocity.x;
                        else if (oldFace === 'left') speed = -this.player.body.velocity.y;
                        else if (oldFace === 'right') speed = this.player.body.velocity.y;
                        
                        let closest = this.physics.closest(this.player, this.platforms.getChildren());
                        if (closest) {
                            let blockW = 32; let pW = 16; 
                            if (newFace === 'top') { 
                                this.player.y = closest.y - blockW - pW; this.player.setVelocity(speed, 0); 
                                if (oldFace === 'left') this.player.x = closest.x - 16; if (oldFace === 'right') this.player.x = closest.x + 16;
                            }
                            else if (newFace === 'bottom') { 
                                this.player.y = closest.y + blockW + pW; this.player.setVelocity(-speed, 0); 
                                if (oldFace === 'left') this.player.x = closest.x - 16; if (oldFace === 'right') this.player.x = closest.x + 16;
                            }
                            else if (newFace === 'left') { 
                                this.player.x = closest.x - blockW - pW; this.player.setVelocity(0, -speed); 
                                if (oldFace === 'top') this.player.y = closest.y - 16; if (oldFace === 'bottom') this.player.y = closest.y + 16;
                            }
                            else if (newFace === 'right') { 
                                this.player.x = closest.x + blockW + pW; this.player.setVelocity(0, speed); 
                                if (oldFace === 'top') this.player.y = closest.y - 16; if (oldFace === 'bottom') this.player.y = closest.y + 16;
                            }
                        }
                        this.currentGravityFace = newFace;
                    }

                    if (!((globalPower === 'levitate' || window.tempUpgrades.levitate) && this.keys.up.isDown)) {
                        gx = this.currentGravity.x; gy = this.currentGravity.y;
                        this.player.body.gravity.x = gx; this.player.body.gravity.y = gy; this.player.setRotation(this.currentGravity.rot); face = this.currentGravity.face;
                    } else {
                        face = 'top';
                        this.player.setRotation(0);
                    }
                    
                    if (onGround) { this.jumps = 0; this.isBonsaiJumping = false; }
                    
                    let speedMag = 350; let vx = 0; let vy = 0; let isMoving = false;
                    
                    if (this.hasBonsai && !this.isBonsaiJumping && (gx !== 0 || gy < 0)) {
                        if (this.cursors.right.isDown) { 
                            isMoving = true; this.facingRight = true; this.player.setFlipX(false);
                            if (face === 'top') { vx = speedMag; vy = 0; } else if (face === 'right') { vx = 0; vy = speedMag; }
                            else if (face === 'bottom') { vx = -speedMag; vy = 0; } else if (face === 'left') { vx = 0; vy = -speedMag; }
                        } 
                        else if (this.cursors.left.isDown) { 
                            isMoving = true; this.facingRight = false; this.player.setFlipX(true);
                            if (face === 'top') { vx = -speedMag; vy = 0; } else if (face === 'right') { vx = 0; vy = -speedMag; }
                            else if (face === 'bottom') { vx = speedMag; vy = 0; } else if (face === 'left') { vx = 0; vy = speedMag; }
                        }
                    } else {
                        if (this.cursors.left.isDown) { vx = -speedMag; this.facingRight = false; this.player.setFlipX(true); isMoving = true; } 
                        else if (this.cursors.right.isDown) { vx = speedMag; this.facingRight = true; this.player.setFlipX(false); isMoving = true; }
                    }

                    if (gy !== 0 || ((globalPower === 'levitate' || window.tempUpgrades.levitate) && this.keys.up.isDown)) {
                        if (isMoving && (Math.abs(this.player.body.velocity.x) <= speedMag || Math.sign(this.player.body.velocity.x) !== Math.sign(vx))) {
                            this.player.setVelocityX(vx);
                        }
                        this.player.setDragX(isMoving ? 0 : 2000); this.player.setDragY(0);
                    } else {
                        if (isMoving && (Math.abs(this.player.body.velocity.y) <= speedMag || Math.sign(this.player.body.velocity.y) !== Math.sign(vy))) {
                            this.player.setVelocityY(vy);
                        }
                        this.player.setDragY(isMoving ? 0 : 2000); this.player.setDragX(0);
                    }

                    let isCharging = false; let chargeColor = 0xffffff;
                    if (this.keys.fireGreen.isDown) { this.chargeGreen += delta; isCharging = true; chargeColor = 0xaaffaa; } 
                    else if (Phaser.Input.Keyboard.JustUp(this.keys.fireGreen)) { this.fireForceBall('green', this.chargeGreen >= 1000); this.chargeGreen = 0; }
                    
                    if (this.keys.fireRed.isDown) { this.chargeRed += delta; isCharging = true; chargeColor = 0xffaaaa; } 
                    else if (Phaser.Input.Keyboard.JustUp(this.keys.fireRed)) { this.fireForceBall('red', this.chargeRed >= 1000); this.chargeRed = 0; }

                    let chargeProgress = 0;
                    if (isCharging) { 
                        chargeProgress = Math.min(1, Math.max(this.chargeGreen, this.chargeRed) / 1000); 
                        this.player.play('charge_player', true); 
                        this.player.setTint(chargeColor);
                        
                        if (!this.isChargeEmitterActive) {
                            if(this.chargeEmitter.start) this.chargeEmitter.start(); else this.chargeEmitter.on = true;
                            this.isChargeEmitterActive = true;
                        }
                        this.chargeEmitter.setPosition(this.player.x, this.player.y);
                    } 
                    else {
                        if (this.isChargeEmitterActive) {
                            if(this.chargeEmitter.stop) this.chargeEmitter.stop(); else this.chargeEmitter.on = false;
                            this.isChargeEmitterActive = false;
                        }
                        if (!onGround && !((globalPower === 'levitate' || window.tempUpgrades.levitate) && this.keys.up.isDown)) { this.player.play('jump_player', true); } else if (isMoving) { this.player.play('run_player', true); } else { this.player.play('idle_player', true); }
                    }
                    
                    if (this.player.isInvincible && !this.isDead && !this.hasPogo) {
                        this.player.setTint(Phaser.Display.Color.HSVToRGB((time%500)/500, 1, 1).color);
                        this.player.setAlpha(0.8);
                        
                        if (this.lightningAura) {
                            this.lightningAura.setVisible(true);
                            this.lightningAura.setPosition(this.player.x, this.player.y);
                            this.lightningAura.setScale(1.5 + 0.2 * Math.sin(time / 50));
                            this.lightningAura.setAlpha(0.5 + 0.3 * Math.sin(time / 50));
                        }
                        if (this.lightningEmitter && !this.isLightningEmitterActive) {
                            this.lightningEmitter.start();
                            this.isLightningEmitterActive = true;
                        }
                    } else if (!isCharging && !this.isDead) {
                        if (this.hasPogo) {
                            this.player.clearTint(); this.player.setAlpha(1); 
                            
                            if (this.lightningAura) this.lightningAura.setVisible(false);
                            if (this.lightningEmitter && this.isLightningEmitterActive) { this.lightningEmitter.stop(); this.isLightningEmitterActive = false; }
                            
                            if (this.pogoAura) {
                                this.pogoAura.setVisible(true); this.pogoAura.setPosition(this.player.x, this.player.y);
                                let pulse = 0.85 + 0.25 * Math.sin(time / 150);
                                this.pogoAura.setScale(pulse); this.pogoAura.setAlpha(0.4 + 0.2 * Math.sin(time / 150));
                            }

                            if (!this.lastTrailTime || time - this.lastTrailTime > 60) {
                                this.lastTrailTime = time;
                                let safeFrame = (this.player.frame && this.player.frame.name !== undefined) ? this.player.frame.name : 0;
                                let shadow = this.add.sprite(this.player.x, this.player.y, 'player', safeFrame);
                                shadow.setFlipX(this.player.flipX); shadow.setRotation(this.player.rotation);
                                shadow.setTintFill(0xffffff); shadow.setAlpha(0.6); shadow.setDepth(this.player.depth - 2); 
                                this.tweens.add({ targets: shadow, alpha: 0, scaleX: 0.5, scaleY: 0.5, duration: 400, onComplete: () => { if(shadow) shadow.destroy(); } });
                            }
                        }
                        else {
                            if (this.pogoAura) this.pogoAura.setVisible(false);
                            if (this.lightningAura) this.lightningAura.setVisible(false);
                            if (this.lightningEmitter && this.isLightningEmitterActive) { this.lightningEmitter.stop(); this.isLightningEmitterActive = false; }
                            
                            if (this.hasBonsai) { this.player.setTint(0x4ade80); this.player.setAlpha(1); } 
                            else if (this.hasWings) { this.player.setTint(0xffea00); this.player.setAlpha(1); }
                            else { this.player.clearTint(); this.player.setAlpha(1); }
                        }
                    } else if (this.isDead || isCharging) {
                        if (this.pogoAura) { this.pogoAura.setVisible(false); }
                        if (this.lightningAura) { this.lightningAura.setVisible(false); }
                        if (this.lightningEmitter && this.isLightningEmitterActive) { this.lightningEmitter.stop(); this.isLightningEmitterActive = false; }
                    }
                    
                    if (this.chargeG) {
                        this.chargeG.clear();
                        if (chargeProgress > 0) {
                            let yOff = (gy < 0) ? 50 : -50; if (gx !== 0) yOff = 0; 
                            let xOff = (gx < 0) ? 50 : (gx > 0 ? -50 : 0);
                            this.chargeG.fillStyle(0x000000, 0.7); 
                            this.chargeG.fillRoundedRect(this.player.x - 20 + xOff, this.player.y + yOff, 40, 6, 3);
                            
                            if (chargeProgress >= 1 && Math.floor(time / 100) % 2 === 0) this.chargeG.fillStyle(0xffffff, 1);
                            else this.chargeG.fillStyle(0xfacc15, 1);
                            
                            this.chargeG.fillRect(this.player.x - 18 + xOff, this.player.y + yOff + 1, 36 * chargeProgress, 4);
                        }
                    }

                    if (jumpJustDown) {
                        let isDouble = !onGround;
                        let jumpVel = this.hasPogo ? 1100 : (isDouble ? 700 : 550); 
                        
                        if (onGround || this.jumps < 2 || this.hasWings || this.hasPogo) { 
                            if (onGround) { this.jumps = 1; playJump(); } else { this.jumps++; playDoubleJump(); }
                            this.isBonsaiJumping = true; this.currentGravityFace = 'top'; 
                            this.player.body.gravity.x = 0; this.player.body.gravity.y = 1200; this.player.setRotation(0);
                            
                            if (face === 'top') { this.player.setVelocityY(-jumpVel); }
                            else if (face === 'bottom') { this.player.setVelocityY(jumpVel); }
                            else if (face === 'left') { this.player.setVelocityX(-jumpVel); this.player.setVelocityY(0); }
                            else if (face === 'right') { this.player.setVelocityX(jumpVel); this.player.setVelocityY(0); }
                        }
                    }
                }

                fireForceBall(color, isCharged) {
                    if (globalGlasses === 'macho' || window.tempUpgrades.macho) {
                        if (color === 'green') playMachoYeah(); else playNoWay();
                    } else {
                        if (color === 'green') playThatsRight(); else playThatsWrong();
                    }

                    const texture = window.tempUpgrades.teddyBears ? 'teddy_bear' : (color === 'green' ? 'fb_green' : 'fb_red');
                    let p = this.projectiles.create(this.player.x + (20*(this.facingRight?1:-1)), this.player.y, texture);
                    p.body.allowGravity = false; p.setVelocityX( (isCharged ? 900 : 600) * (this.facingRight?1:-1) ); p.color = color; p.isCharged = isCharged;
                    p.setDepth(15);
                    
                    if (isCharged) {
                        p.setScale(3.0);
                        p.emitter = this.particles.createEmitter({ speed: 60, scale: { start: 1.5, end: 0 }, blendMode: 'ADD', tint: color==='green'?0x22c55e:0xef4444, lifespan: 500 });
                        p.emitter.startFollow(p); 
                    } else {
                        p.setScale(1.2);
                        p.emitter = this.particles.createEmitter({ speed: 30, scale: { start: 0.6, end: 0 }, blendMode: 'ADD', tint: color==='green'?0x22c55e:0xef4444, lifespan: 300 });
                        p.emitter.startFollow(p);
                    }
                    
                    let em = p.emitter;
                    this.time.delayedCall(1500, () => {
                        if (em) { 
                            em.stopFollow(); 
                            if(em.stop) em.stop(); else em.on = false; 
                        }
                        this.time.delayedCall(1000, () => {
                            if (this.sys && this.sys.isActive() && this.particles && em) {
                                try { this.particles.removeEmitter(em); } catch(err){}
                            }
                        });
                    });
                    
                    this.time.delayedCall(2000, () => { 
                        if(p && p.active) { 
                            if (p.emitter) p.emitter.stopFollow();
                            p.destroy(); 
                        }
                    });
                }

                spawnBoss(x, y) {
                    this.boss = this.physics.add.sprite(x, y-100, `boss_${this.currentWorld}`); 
                    this.boss.body.setSize(80, 100); this.boss.body.setOffset(24, 10);
                    this.boss.setCollideWorldBounds(false); this.boss.body.allowGravity = false; this.enemies.add(this.boss); this.boss.isBoss = true;
                    this.boss.setDepth(45);
                    
                    this.boss.requiredHits = 10 + ((this.currentWorld-1)*5); this.boss.hitsRemaining = this.boss.requiredHits;
                    let names = ["Barnaby (Fractions)", "DJ Synth (Patterns)", "Gorilla (Mass)", "Penelope (Perimeter)", "Cosmos (Arrays)", "Unit Master", "The Guardian of Math"];
                    let titles = ["Addition", "Subtraction", "Multiplication", "Division", "Comparisons", "Unit Conversions", "Ultimate"];
                    this.stageName = titles[this.currentWorld-1];

                    this.bossText = this.add.text(x, y - 200, `${names[this.currentWorld-1]}\nBalls left: ${this.boss.hitsRemaining}`, { fontFamily: kidFont, fontSize: '24px', color: '#fff', align: 'center', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(50);
                    
                    if (this.currentWorld === 7) {
                        this.boss.setScale(1.5);
                        this.boss.body.setSize(160, 200);
                        this.boss.body.setOffset(48, 20);
                        this.boss.y -= 50;
                        this.bossText.y -= 80;
                    }
                    
                    this.bossThrowEvent = this.time.addEvent({ delay: 3000, callback: this.bossThrowBall, callbackScope: this, loop: true });

                    this.bossVoiceEvent = this.time.addEvent({
                        delay: 20000,
                        callback: () => {
                            if (this.boss && this.boss.active && !this.isPaused && !this.isWinning && !this.isDead) {
                                let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
                                if (dist < 800) {
                                    let msg = Math.random() > 0.5 ? "Hahaha, You'll never win!" : "Hahaha, you need more practise!";
                                    speakBoss(msg);
                                }
                            }
                        }, callbackScope: this, loop: true
                    });
                }

                bossThrowBall() {
                    if(!this.boss || !this.boss.active || this.isPaused || this.isAnswering) return;
                    
                    let activeBossFoes = 0;
                    this.bossBalls.getChildren().forEach(b => { if (b.active && b.x > this.levelLength - 800) activeBossFoes++; });
                    this.enemies.getChildren().forEach(e => { if (e.active && !e.isBoss && e.x > this.levelLength - 800) activeBossFoes++; });
                    
                    if(activeBossFoes >= 5) return;

                    let ball = this.bossBalls.create(this.boss.x - 100, this.boss.y, `foe_${this.currentWorld > 6 ? Math.floor(Math.random()*6)+1 : this.currentWorld}`); 
                    ball.body.setSize(36, 40); ball.body.setOffset(6, 8);
                    let math = this.generateMathProblem(); ball.isCorrect = math.isCorrect;
                    
                    ball.mathText = this.add.text(ball.x, ball.y - 40, math.text, { fontFamily: kidFont, fontSize: '22px', color: '#fff', stroke: '#000', strokeThickness: 4, backgroundColor: '#000000a0', padding: {x: 6, y: 4} }).setOrigin(0.5).setDepth(50);

                    let velocityX = -200; let velocityY = -250;
                    if (Math.random() > 0.5) { velocityX = -300 - Math.random() * 85; velocityY = -380; } 
                    else { velocityX = -150 - Math.random() * 50; velocityY = -180; }

                    ball.body.setVelocityX(velocityX); ball.body.setVelocityY(velocityY); ball.body.setBounce(1, 0.8); ball.body.setCollideWorldBounds(true);
                }

                hitBossBall(projectile, ball) {
                    let requiresGreen = ball.isCorrect; let isProjGreen = projectile.color === 'green';
                    if ((requiresGreen && isProjGreen) || (!requiresGreen && !isProjGreen)) {
                        
                        this.stageCorrectAnswers++; this.stageTotalAnswers++;
                        window.gameStats.correct++; window.gameStats.total++;
                        this.addMoney(0.05);

                        playPowerup(); if (ball.mathText) ball.mathText.destroy(); ball.destroy(); 
                        if (projectile.emitter) { 
                            let em = projectile.emitter; 
                            em.stopFollow(); 
                            if(em.stop) em.stop(); else em.on = false; 
                            this.time.delayedCall(1000, ()=> { if(this.sys && this.sys.isActive() && this.particles && em) { try { this.particles.removeEmitter(em); } catch(err){} } }); 
                        }
                        projectile.destroy();
                        
                        let damage = projectile.isCharged ? 3 : 1;
                        this.boss.hitsRemaining = Math.max(0, this.boss.hitsRemaining - damage);
                        this.bossText.setText(`${this.currentWorld===7?"The Guardian of Math":"Boss"}\nBalls left: ${this.boss.hitsRemaining}`);
                        this.boss.setFrame(1); playGrrr(); this.boss.setTintFill(0xffffff);
                        this.time.delayedCall(150, () => { if(this.boss && this.boss.active) this.boss.setTint(0xffaaaa); });
                        this.time.delayedCall(1000, () => { if(this.boss && this.boss.active) this.boss.setFrame(0); });
                        if (this.boss.hitsRemaining <= 0) this.bossDefeated();
                    } else { 
                        this.stageTotalAnswers++; window.gameStats.total++;
                        if (projectile.active && !projectile.hasReflected) {
                            projectile.hasReflected = true; this.takeDamage(this.player, null);
                            playClink(); projectile.body.setVelocityY(-400); projectile.body.setVelocityX(-projectile.body.velocity.x); projectile.body.gravity.y = 800; 
                        }
                    }
                }

                bossDefeated() {
                    if (this.isWinning) return;
                    this.isWinning = true; 
                    
                    this.addMoney(2.50);

                    if (this.bossThrowEvent) this.bossThrowEvent.destroy();
                    if (this.bossVoiceEvent) this.bossVoiceEvent.destroy();
                    this.boss.destroy(); if(this.bossText) this.bossText.destroy(); 
                    
                    this.player.setVelocity(0,0); this.player.setAcceleration(0,0);
                    this.time.delayedCall(0, () => { if (this.player && this.player.body) this.player.body.enable = false; });
                    
                    playPowerup(); this.player.play('win_player');
                    
                    this.time.delayedCall(2000, () => {
                        this.showLevelCompleteOverlay();
                    });
                }

                showLevelCompleteOverlay() {

                    this.add.text(bg.x, 150, "STAGE CLEAR!", { fontFamily: titleFont, fontSize: '60px', color: '#facc15', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(301);
                    this.add.text(bg.x, 230, `Correct Answers: ${this.stageCorrectAnswers} / ${this.stageTotalAnswers}`, { fontFamily: kidFont, fontSize: '30px', color: '#fff' }).setOrigin(0.5).setDepth(301);
                    this.add.text(bg.x, 280, `Accuracy: ${acc}%`, { fontFamily: titleFont, fontSize: '35px', color: acc >= 85 ? '#4ade80' : '#f87171' }).setOrigin(0.5).setDepth(301);
                    
                    let beltMsg = "";

                    } else {
                        beltMsg = `(Score 85%+ to earn the Stage Belt!)`;
                    }
                    this.add.text(bg.x, 350, beltMsg, { fontFamily: kidFont, fontSize: '28px', color: acc >= 85 ? '#facc15' : '#94a3b8', fontStyle: 'bold' }).setOrigin(0.5).setDepth(301);

                    this.add.text(bg.x, 400, `Total Belts Earned: ${window.unlockedBelts.length} / 7`, { fontFamily: kidFont, fontSize: '24px', color: '#38bdf8' }).setOrigin(0.5).setDepth(301);

                    let replayBtn = this.add.text(bg.x - 220, 480, "[ PLAY THIS LEVEL AGAIN ]", { fontFamily: titleFont, fontSize: '26px', color: '#ffffff', backgroundColor: '#3b82f6', padding: {x: 15, y: 10}, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(301).setInteractive();
                    let nextBtn = this.add.text(bg.x + 220, 480, "[ ENTER NEXT LEVEL ]", { fontFamily: titleFont, fontSize: '26px', color: '#ffffff', backgroundColor: '#22c55e', padding: {x: 15, y: 10}, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(301).setInteractive();
                    
                    this.tweens.add({ targets: [replayBtn, nextBtn], scaleX: 1.05, scaleY: 1.05, duration: 500, yoyo: true, repeat: -1 });

                    replayBtn.on('pointerdown', () => {
                        if(this.isFading) return;
                        this.isFading = true; this.physics.pause(); this.cameras.main.fade(1000, 0, 0, 0);
                        this.time.delayedCall(1000, () => {
                            this.scene.start('GameScene', { world: this.currentWorld, score: this.score, lives: this.lives, passedTut: true });
                        });

                    } else if (type === 'protractor') {

                        this.promptG.fillStyle(0xfca5a5, 0.4);

                    } else if (type === 'protractor_text') {

                handlePromptInput(e) {
                    if(!this.isAnswering) return;
                    let isTime = this.promptType === 'clock'; 
                    
                    if (e.key === 'Backspace') { this.answerString = this.answerString.slice(0, -1); } 
                    else if (e.key === 'Enter') {
                        e.preventDefault(); this.input.keyboard.off('keydown', this.handlePromptInputBound);
                        if(this.promptBg) this.promptBg.destroy(); if(this.promptG) this.promptG.destroy();
                        if(this.promptQ) this.promptQ.destroy(); if(this.promptA) this.promptA.destroy(); if(this.promptInst) this.promptInst.destroy();
                        this.promptExtraText.forEach(t => t.destroy()); this.promptExtraText = [];
                        this.isAnswering = false; this.physics.resume();
                        if(this.promptCallback) this.promptCallback(this.answerString); return;
                    } 
                    else if (e.key.length === 1) {
                        // Allow letters and numbers for ALL prompts to prevent silent dropping of keystrokes 
                        if (/[a-zA-Z0-9\s\-]/.test(e.key)) { this.answerString += e.key; } 
                    }
                    
                    let displayStr = this.answerString;
                    if (isTime) { if(this.answerString.length > 2 && !this.answerString.includes(':')) { displayStr = this.answerString.slice(0,-2) + ":" + this.answerString.slice(-2); } }

                generateMathProblem() {
                    let w = this.currentWorld; let isCorrect = Math.random() > 0.5; let text = "";
                    if (w === 7) w = Math.floor(Math.random() * 5) + 1; 
                    
                    if (w === 1) { 
                        let a = Math.floor(Math.random() * 10) + 1; 
                        let b; let rand = Math.random();
                        if (rand < 0.4) b = a; else if (rand < 0.8) { b = a + (Math.random()>0.5?1:-1); if(b<=0)b=1; } else b = Math.floor(Math.random() * (20 - a)) + 1; 
                        let trueC = a + b;
                        let c = isCorrect ? trueC : (trueC + (Math.random()>0.5?1:-1)*Math.floor(Math.random()*3+1)); 
                        if (!isCorrect && c === trueC) c += 1;
                        text = `${a} + ${b} = ${c}`;
                    } else if (w === 2) { 
                        let a = Math.floor(Math.random()*20)+1; let b = Math.floor(Math.random()*a)+1;
                        let trueC = a - b;
                        let c = isCorrect ? trueC : (trueC + (Math.random()>0.5?1:-1)*Math.floor(Math.random()*3+1)); 
                        if (!isCorrect && c === trueC) c += 1;
                        if (!isCorrect && c < 0) c = trueC + 1; 
                        text = `${a} - ${b} = ${c}`;
                    } else if (w === 3) {
                        let a = Math.floor(Math.random()*10)+1; let b = Math.floor(Math.random()*10)+1;
                        let trueC = a * b;
                        let c = isCorrect ? trueC : (trueC + (Math.random()>0.5?1:-1)*Math.floor(Math.random()*3+1)); 
                        if (!isCorrect && c === trueC) c += 1;
                        text = `${a} x ${b} = ${c}`;
                    } else if (w === 4) {
                        let c = Math.floor(Math.random()*10)+1; let b = Math.floor(Math.random()*10)+1; let a = b * c;
                        let fakeC = c + (Math.random()>0.5?1:-1)*Math.floor(Math.random()*3+1); 
                        if (!isCorrect && fakeC === c) fakeC += 1;
                        if (!isCorrect && fakeC <= 0) fakeC = c + 1; 
                        text = `${a} ÷ ${b} = ${isCorrect ? c : fakeC}`;
                    } else if (w === 5) {
                        let a = Math.floor(Math.random()*100)+1; let b = Math.floor(Math.random()*100)+1; if(a===b) b++; 
                        let trueOp = a > b ? '>' : '<'; let falseOp = a > b ? '<' : '>'; 
                        text = `${a} ${isCorrect ? trueOp : falseOp} ${b}`;
                    } else if (w === 6) {
                        let types = [ {u1:'mm', u2:'cm', f:10}, {u1:'cm', u2:'m', f:100}, {u1:'m', u2:'km', f:1000} ]; 
                        let t = types[Math.floor(Math.random()*types.length)]; 
                        let val = Math.floor(Math.random()*10+1) * t.f; 
                        let correctAns = val / t.f;
                        let wrongAns = correctAns === 1 ? 10 : 1; 
                        text = `${val}${t.u1} = ${isCorrect ? correctAns : wrongAns}${t.u2}`;
                    }
                    return { text, isCorrect };
                }
