                                    this.tweens.addCounter({
                                        from: 0, to: 100, duration: 10000,
                                        onUpdate: (tween) => { this.player.setTint(Phaser.Display.Color.HSVToRGB(tween.getValue()/100, 1, 1).color); if (Math.floor(tween.getValue()) % 4 === 0) this.player.setAlpha(0.3); else this.player.setAlpha(1); },
                                        onComplete: () => { this.player.isInvincible = false; this.player.setAlpha(1); this.player.clearTint(); stopStarTheme(); }
                                    });
                                } else { playNeedPractice(); }
                            });
                        }
                    } else if (iName === 'thermometer') {
                        if(this.promptAnswer) {
                            if (Math.random() < 0.4) {
                                let temp = (Math.floor(Math.random() * 14) * 5) - 15; 
                                this.promptAnswer('thermometer', temp, null, `What's the temperature on this thermometer?`, (ans) => {
                                    if (ans === temp.toString()) { playLoveMath(); if(this.score !== undefined) { this.score += 1000; this.updateHUD(); } } 
                                    else { playNeedPractice(); }
                                });
                            } else {
                                let qs = [
                                    { q: "At what temperature does water freeze (in Celsius)?", a: ["0", "0 degrees"] },
                                    { q: "At what temperature does water boil (in Celsius)?", a: ["100", "100 degrees"] },
                                    { q: "What is considered normal room temperature (in Celsius)?", a: ["20", "21", "22", "23", "20 degrees", "21 degrees", "22 degrees", "23 degrees"] },
                                    { q: "Is 30 degrees Celsius considered a hot or cold day?", a: ["hot", "hot day", "a hot day"] },
                                    { q: "Is -15 degrees Celsius considered a hot or cold day?", a: ["cold", "cold day", "a cold day"] }
                                ];
                                let qObj = Phaser.Utils.Array.GetRandom(qs);
                                let qType = qObj.a[0].match(/^[0-9\-]+$/) ? 'generic_number' : 'generic_text';
                                this.promptAnswer(qType, null, null, qObj.q, (ans) => {
                                    if (qObj.a.some(validAns => ans.toLowerCase().trim() === validAns.toLowerCase())) {
                                        playLoveMath(); if(this.score !== undefined) { this.score += 1000; this.updateHUD(); }
                                    } else { playNeedPractice(); }
                                });
                            }
                        }
                    } else if (iName === 'protractor') {
                        let geoQs = [
                            {q: "How many degrees in a right angle?", a: ["90", "90 degrees"]},
                            {q: "What is the sum of interior angles in a triangle?", a: ["180", "180 degrees"]},
                            {q: "How many right angles are in a standard square?", a: ["4"]},
                            {q: "An angle of 180 degrees is called what?", a: ["straight", "straight angle"]},
                            {q: "How many degrees are in a full circle?", a: ["360", "360 degrees"]},
                            {q: "How many degrees in a half circle?", a: ["180", "180 degrees"]},
                            {q: "How many degrees in a quarter circle?", a: ["90", "90 degrees"]},
                            {q: "A polygon with 3 sides is called a what?", a: ["triangle"]},
                            {q: "A polygon with 4 sides is called a what?", a: ["quadrilateral"]},
                            {q: "A polygon with 5 sides is called a what?", a: ["pentagon"]},
                            {q: "A polygon with 6 sides is called a what?", a: ["hexagon"]},
                            {q: "A polygon with 8 sides is called a what?", a: ["octagon"]}
                        ];
                        
                        if (Math.random() < 0.75) {
                            let angles = [60, 60, 90, 90, 108, 108, 120, 120, 135, 135, 144];
                            for (let a = 15; a <= 165; a += 15) {
                                if (a !== 90 && !angles.includes(a)) angles.push(a);
                            }
                            let randomAngle = Phaser.Utils.Array.GetRandom(angles);
                            
                            if (this.promptAnswer) {
                                this.promptAnswer('protractor', randomAngle, null, `Read the angle. Determine if it's acute or obtuse,\nthen read the corresponding scale. How many degrees?`, (ans) => {
                                    if (ans.trim() === randomAngle.toString()) {
                                        playLoveMath(); if(this.score !== undefined) { this.score += 1000; this.updateHUD(); }
                                    } else {
                                        playNeedPractice();
                                    }
                                });
                            }
                        } else {
                            let q = Phaser.Utils.Array.GetRandom(geoQs);
                            if(this.promptAnswer) {
                                let qType = q.a[0].match(/^[0-9]+$/) ? 'generic_number' : 'protractor_text';
                                this.promptAnswer(qType, null, null, q.q, (ans) => {
                                    if (q.a.some(validAns => ans.toLowerCase().trim() === validAns.toLowerCase())) { 
                                        playLoveMath(); if(this.score !== undefined) { this.score += 500; this.updateHUD(); } 
                                    } else { 
                                        playNeedPractice(); 
                                    }
                                });
                            }
                        }
                    } else if (iName === 'bonsai') {
                        playBonzai(); this.hasBonsai = true; this.score += 200; this.updateHUD();
                        this.player.setTint(0x4ade80); this.currentGravityFace = 'top'; this.currentGravity = {x: 0, y: 1200, rot: 0, face: 'top'};
                    } else if (iName === 'pogo') {
                        playPogoPower(); this.hasPogo = true; this.score += 200; this.updateHUD();
                    } else if (iName === 'lightning_bolt') {
                        playImInvincible(); this.hasLightningPower = true; this.player.isInvincible = true; this.score += 300; this.updateHUD();
                        this.time.delayedCall(10000, () => { this.hasLightningPower = false; if(this.player && this.player.active) { this.player.isInvincible = false; this.player.clearTint(); this.player.setAlpha(1); } });
                    } else if (iName === 'gem') {
                        playClink(); this.score += 100; this.updateHUD();
                    } else if (iName === 'heart') {
                        playHeart(); this.health = Math.min(this.maxHealth, this.health + 1); this.updateHUD();
                    } else if (iName === 'pizza') {
                        playDelicious(); this.health = Math.min(this.maxHealth, this.health + 1); this.score += 500; this.updateHUD();
                    }
                }

                hitEnemy(projectile, enemy) {
                    let requiresGreen = enemy.isCorrect; let isProjGreen = projectile.color === 'green';

                    if ((requiresGreen && isProjGreen) || (!requiresGreen && !isProjGreen)) {
                        
                        this.stageCorrectAnswers++; this.stageTotalAnswers++;
                        window.gameStats.correct++; window.gameStats.total++;
                        
                        if (enemy.isGiant) this.addMoney(0.10); else this.addMoney(0.05);
                        
                        let damage = projectile.isCharged ? 3 : 1;
                        enemy.hp -= damage;
                        this.updateFoeHP(enemy); playPowerup();
                        if (projectile.emitter) { 
                            let em = projectile.emitter; 
                            em.stopFollow(); 
                            if(em.stop) em.stop(); else em.on = false; 
                            this.time.delayedCall(1000, ()=> { if(this.sys && this.sys.isActive() && this.particles && em) { try { this.particles.removeEmitter(em); } catch(err){} } }); 
                        }
                        projectile.destroy();
                        
                        enemy.setTintFill(0xffffff);
                        this.time.delayedCall(150, () => { if(enemy && enemy.active && !enemy.isFlashing) enemy.clearTint(); });
                        if (enemy.hp <= 0) { this.score += (enemy.isGiant ? 500 : (enemy.isBird ? 300 : 100)); this.updateHUD(); this.destroyFoeCleanly(enemy, true); }
                    } else { 
                        this.stageTotalAnswers++; window.gameStats.total++;
                        if (projectile.active && !projectile.hasReflected) { projectile.hasReflected = true; this.takeDamage(this.player, enemy); playClink(); projectile.body.setVelocityY(-400); projectile.body.setVelocityX(-projectile.body.velocity.x); projectile.body.gravity.y = 800; } 
                    }
                }

                destroyFoeCleanly(foe, withVisualEffect = false) {
                    if (foe.mathText) foe.mathText.destroy();
                    if (foe.hpBarBg) foe.hpBarBg.destroy();
                    if (foe.hpBar) foe.hpBar.destroy();
                    
                    if (withVisualEffect && this.particles) {
                        let parts = this.particles.createEmitter({
                            x: foe.x, y: foe.y,
                            speed: { min: -100, max: 100 },
                            angle: { min: 0, max: 360 },
                            scale: { start: 1, end: 0 },
                            lifespan: 600,
                            maxParticles: 12
                        });
                        this.time.delayedCall(1000, () => {
                            if (this.sys && this.sys.isActive() && this.particles && parts) {
                                try { this.particles.removeEmitter(parts); } catch(err){}
                            }
                        });
                    }
                    foe.destroy();
                }

                takeDamage(player, hazard) {
                    if (player.isInvincible || this.isDead || this.isWinning) return;

                    playDamage();
                    this.health--;
                    this.updateHUD();

                    if (this.health <= 0) {
                        this.die();
                    } else {
                        player.isInvincible = true;
                        player.play('hurt_player');
                        
                        let knockDirection = (hazard && hazard.x < player.x) ? 300 : -300;
                        player.setVelocity(knockDirection, -250);
                        this.isStunned = true;

                        this.time.delayedCall(300, () => {
                            this.isStunned = false;
                        });

                        this.tweens.add({
                            targets: player,
                            alpha: 0.3,
                            duration: 100,
                            yoyo: true,
                            repeat: 9,
                            onComplete: () => {
                                if (player && player.active) {
                                    player.isInvincible = false;
                                    player.alpha = 1;
                                }
                            }
                        });
                    }
                }

                die() {
                    if (this.isDead) return;
                    this.isDead = true;
                    this.physics.pause();
                    this.player.play('hurt_player');
                    this.player.setTint(0xff0000);
                    
                    if (this.bossThrowEvent) this.bossThrowEvent.destroy();
                    if (this.bossVoiceEvent) this.bossVoiceEvent.destroy();
                    
                    this.time.delayedCall(1000, () => {
                        this.cameras.main.fade(1000, 0, 0, 0);
                        this.time.delayedCall(1000, () => {
                            // Infinite lives: always restart the current world/checkpoint
                            this.scene.start('GameScene', {
                                world: this.currentWorld,
                                score: Math.max(0, this.score - 1000),
                                lives: 3, 
                                passedTut: this.passedTut,
                                checkpointX: this.passedCheckpoint ? this.halfwayX : 0
                            });
                        });
                    });
                }
            }

            class EndingScene extends Phaser.Scene {
                constructor() { super('EndingScene'); }
                init(data) { this.finalScore = data.score || 0; }
                create() {
                    playTitleTheme();
                    this.cameras.main.fadeIn(1000, 0, 0, 0);
                    
                    this.add.image(480, 270, 'bg_sky_6').setScale(960, 1).setScrollFactor(0);
                    this.add.image(480, 400, 'castle_of_lions').setScale(1.2);
                    
                    this.add.text(480, 80, "CONGRATULATIONS!", { fontFamily: titleFont, fontSize: '60px', color: '#facc15', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5);
                    this.add.text(480, 150, "You completed all math trials and saved the Kingdom!", { fontFamily: kidFont, fontSize: '28px', color: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
                    this.add.text(480, 220, `FINAL SCORE: ${this.finalScore}`, { fontFamily: titleFont, fontSize: '36px', color: '#4ade80', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5);
                    
                    let restartBtn = this.add.text(480, 320, "[ PLAY AGAIN ]", { fontFamily: titleFont, fontSize: '28px', color: '#fff', backgroundColor: '#16a34a', padding: 15, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setInteractive();
                    this.tweens.add({ targets: restartBtn, scaleX: 1.05, scaleY: 1.05, duration: 500, yoyo: true, repeat: -1 });

                    restartBtn.on('pointerdown', () => {
                        window.location.reload();
                    });
                }
            }

            const config = {
                type: Phaser.AUTO,
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH,
                    width: 960,
                    height: 540
                },
                parent: 'game-container',
                physics: {
                    default: 'arcade',
                    arcade: {
                        gravity: { y: 1200 },
                        debug: false
                    }
                },
                scene: [BootScene, TitleScene, TransitionScene, GameScene, EndingScene]
            };

            gameInstance = new Phaser.Game(config);
        }
    </script>
</body>
</html>
