    <style>
        body {
            margin: 0; padding: 0; background-color: #050510; color: #fff;
            font-family: 'Bubblegum Sans', cursive, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #game-wrapper {
            position: relative; width: 960px; height: 540px;
            box-shadow: 0 0 30px #0ea5e9; border: 4px solid #1e293b; border-radius: 8px;
        }
        #game-wrapper:fullscreen, #game-wrapper:-webkit-full-screen {
            width: 100vw; height: 100vh; border: none; border-radius: 0; box-shadow: none; background-color: #050510;
        }
        #game-container { image-rendering: optimizeQuality; width: 100%; height: 100%; }
        #game-container canvas { width: 100% !important; height: 100% !important; object-fit: fill; }
        
        #ui-panel {
            text-align: center; width: 960px; background: #0f172a;
            padding: 10px 0px; border-radius: 8px; border: 1px solid #334155; margin-top: 10px;
        }
        .controls { color: #facc15; font-weight: bold; font-size: 20px; margin: 5px 0; font-family: 'Bubblegum Sans', cursive;}
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); border-radius: 4px;
        }
        .start-box {
            background: #1e293b; border: 4px solid #38bdf8; border-radius: 12px; padding: 14px 28px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            max-height: 90vh; overflow-y: auto; overflow-x: hidden; width: auto; max-width: 95vw;
        }
        .start-box h1 { 
            color: #facc15; font-size: 38px; margin: 0 0 10px 0; text-shadow: 3px 3px 0 #000; 
            font-family: 'Luckiest Guy', cursive; letter-spacing: 2px;
        }
        .input-group { margin: 6px 0; font-size: 18px; font-family: 'Bubblegum Sans', cursive; }
        .input-group input[type="text"] {
            font-family: 'Bubblegum Sans', cursive; font-size: 18px; padding: 5px 8px;
            border-radius: 6px; border: 2px solid #38bdf8; outline: none; width: 140px; text-align: center;
        }
        .swatch-container { display: flex; gap: 5px; justify-content: center; margin-top: 6px; }
        .color-swatch {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent;
        }
        .color-swatch.selected { border-color: #facc15; transform: scale(1.2); }
        .btn-start {
            background: #22c55e; color: #fff; font-family: 'Luckiest Guy', cursive; font-size: 22px;
            padding: 7px 22px; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px;
            box-shadow: 0 4px 0 #166534; letter-spacing: 1px;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0 0 #166534; }
        
        .overlay-btn {
            position: absolute; top: 10px; padding: 8px 12px;
            background: #1e293b88; border: 2px solid #38bdf8; border-radius: 6px;
            color: #fff; font-family: 'Bubblegum Sans', cursive; font-size: 18px;
            cursor: pointer; z-index: 10; backdrop-filter: blur(4px);
        }
        .overlay-btn:hover { background: #38bdf8; color: #000; }
        #btn-fullscreen { right: 10px; }
        #btn-music { right: 170px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="start-screen">
            <div class="start-box">
                <h1>SUPER MATH HERO</h1>
                <div style="display:flex; justify-content:center; gap:20px;">
                    <!-- Left: Boss Gallery -->
                    <div class="input-group" id="boss-gallery-group" style="display:none; margin:4px 0; align-items:center; flex-direction:column;">
                        <label style="color:#facc15;">Boss Gallery:</label>
                        <div style="display:flex; align-items:center; gap:8px; justify-content:center;">
                            <button type="button" class="btn-start" style="padding:4px 10px; min-width:30px;" onclick="cycleBoss(-1)">&lt;</button>
                            <div style="background:rgba(0,0,0,0.3); border:2px solid #38bdf8; border-radius:8px; padding:4px;">
                                <canvas id="boss-thumbnail" width="128" height="128" style="background:#1e293b; border-radius:4px;"></canvas>
                            </div>
                            <button type="button" class="btn-start" style="padding:4px 10px; min-width:30px;" onclick="cycleBoss(1)">&gt;</button>
                        </div>
                        <div id="boss-thumbnail-label" style="text-align:center; font-family:'Bubblegum Sans', cursive; margin-top:4px; font-size:18px; color:#fff;">World 1 Boss</div>
                    </div>

                    <!-- Right: Main Options -->
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <!-- Top row: Name + Character side by side -->
                        <div style="display:flex; gap:16px; align-items:center; justify-content:center; margin-bottom:8px;">
                            <div class="input-group" style="margin:0;">
                                <label>Ninja Name:</label><br>
                                <input type="text" id="playerName" placeholder="Enter Name" maxlength="12" value="Hero"
                                    onblur="globalPlayerName=this.value; window.updateEquipmentUI(); if(window.loadGameData) window.loadGameData(this.value)"
                                    onkeydown="if(event.key==='Enter'){event.preventDefault(); event.stopPropagation(); this.blur();}">

        window.drawBoss = (ctx, x, face, hatType, mainColor) => {

            ctx.fillStyle = '#334155'; ctx.fillRect(20, 50, 12, 30); ctx.fillRect(96, 50, 12, 30);
            ctx.fillStyle = mainColor; ctx.fillRect(14, 70, 24, 25); ctx.fillRect(90, 70, 24, 25); 
            ctx.fillStyle = '#334155'; ctx.fillRect(44, 90, 14, 20); ctx.fillRect(70, 90, 14, 20);
            ctx.fillStyle = mainColor; ctx.beginPath(); ctx.moveTo(40, 100); ctx.lineTo(60, 100); ctx.lineTo(64, 120); ctx.lineTo(36, 120); ctx.fill(); ctx.beginPath(); ctx.moveTo(68, 100); ctx.lineTo(88, 100); ctx.lineTo(92, 120); ctx.lineTo(64, 120); ctx.fill();
            ctx.fillStyle = mainColor; ctx.beginPath(); ctx.arc(64, 26, 22, Math.PI, 0); ctx.lineTo(86, 40); ctx.lineTo(42, 40); ctx.fill();
            ctx.fillStyle = '#0f172a'; ctx.fillRect(48, 20, 32, 20);
            
            if(hatType === 'chef') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(64, 0, 15, 0, Math.PI*2); ctx.arc(50, 8, 10, 0, Math.PI*2); ctx.arc(78, 8, 10, 0, Math.PI*2); ctx.fill(); } 
            else if(hatType === 'neon') { ctx.fillStyle = '#06b6d4'; ctx.fillRect(60, 5, 8, 15); ctx.fillStyle = '#f472b6'; ctx.fillRect(44, 10, 40, 4); } 
            else if(hatType === 'gorilla') { ctx.fillStyle = '#451a03'; ctx.beginPath(); ctx.arc(42, 16, 10, 0, Math.PI*2); ctx.arc(86, 16, 10, 0, Math.PI*2); ctx.fill(); ctx.fillRect(44, 40, 40, 20); } 
            else if(hatType === 'penguin') { ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.moveTo(64, -5); ctx.lineTo(50, 15); ctx.lineTo(78, 15); ctx.fill(); } 
            else if(hatType === 'cosmos') { ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(64, 5, 12, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(64, 5, 18, 0, Math.PI*2); ctx.stroke(); } 
            else { ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.moveTo(64, 5); ctx.lineTo(54, 20); ctx.lineTo(74, 20); ctx.fill(); } 
            
            ctx.fillStyle = '#ef4444'; 
            if(face === 'annoyed') { ctx.beginPath(); ctx.moveTo(50, 22); ctx.lineTo(60, 26); ctx.lineTo(50, 26); ctx.fill(); ctx.beginPath(); ctx.moveTo(78, 22); ctx.lineTo(68, 26); ctx.lineTo(78, 26); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(58, 32, 12, 2); } 
            else if(face === 'angry') { ctx.fillStyle = '#facc15'; ctx.fillRect(50, 22, 8, 8); ctx.fillRect(70, 22, 8, 8); ctx.fillStyle = '#fff'; ctx.fillRect(60, 32, 8, 6); } 
            else if(face === 'laughing') { ctx.beginPath(); ctx.moveTo(50, 26); ctx.quadraticCurveTo(55, 20, 60, 26); ctx.stroke(); ctx.beginPath(); ctx.moveTo(68, 26); ctx.quadraticCurveTo(73, 20, 78, 26); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(64, 32, 6, 0, Math.PI, false); ctx.fill(); }
            ctx.restore();
        };
        
        window.drawGuardian = (ctx, x, face) => {
            ctx.save(); ctx.translate(x, 0);
            let silver = "#e2e8f0"; let darkMetal = "#334155"; let blue = "#2563eb"; let red = "#dc2626"; let yellow = "#facc15"; let green = "#16a34a";
            ctx.fillStyle = red; ctx.beginPath(); ctx.moveTo(128, 100); ctx.lineTo(20, 20); ctx.lineTo(60, 120); ctx.fill();
            ctx.fillStyle = green; ctx.beginPath(); ctx.moveTo(128, 100); ctx.lineTo(236, 20); ctx.lineTo(196, 120); ctx.fill();
            ctx.fillStyle = darkMetal; ctx.fillRect(80, 180, 30, 70); ctx.fillRect(146, 180, 30, 70);
            ctx.fillStyle = blue; ctx.fillRect(70, 210, 40, 46); ctx.fillStyle = yellow; ctx.fillRect(140, 210, 40, 46);
            ctx.fillStyle = darkMetal; ctx.fillRect(40, 100, 30, 80); ctx.fillRect(186, 100, 30, 80);
            ctx.fillStyle = red; ctx.fillRect(30, 140, 40, 50); ctx.fillStyle = green; ctx.fillRect(186, 140, 40, 50);
            ctx.fillStyle = silver; ctx.beginPath(); ctx.arc(55, 100, 25, 0, Math.PI*2); ctx.arc(201, 100, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = silver; ctx.fillRect(80, 80, 96, 100);
            ctx.fillStyle = darkMetal; ctx.beginPath(); ctx.moveTo(80,80); ctx.lineTo(128,120); ctx.lineTo(176,80); ctx.fill();
            ctx.fillStyle = yellow; ctx.beginPath(); ctx.arc(128, 130, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(118, 125, 5, 0, Math.PI*2); ctx.arc(138, 125, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(110, 140); ctx.lineTo(146, 140); ctx.lineTo(128, 160); ctx.fill();
            ctx.fillStyle = darkMetal; ctx.fillRect(108, 30, 40, 50);
            ctx.fillStyle = silver; ctx.fillRect(113, 40, 30, 40);
            ctx.fillStyle = yellow; ctx.beginPath(); ctx.moveTo(100, 20); ctx.lineTo(128, 50); ctx.lineTo(156, 20); ctx.lineTo(128, 40); ctx.fill();
            ctx.fillStyle = red;
            if (face === 'annoyed') { ctx.fillRect(115, 50, 10, 5); ctx.fillRect(130, 50, 10, 5); }
            else if (face === 'angry') { ctx.beginPath(); ctx.moveTo(115, 50); ctx.lineTo(125, 55); ctx.lineTo(115, 55); ctx.fill(); ctx.beginPath(); ctx.moveTo(140, 50); ctx.lineTo(130, 55); ctx.lineTo(140, 55); ctx.fill(); }
            else { ctx.fillRect(118, 50, 8, 4); ctx.fillRect(130, 50, 8, 4); }
            ctx.restore();
        };

        window.currentBossIndex = 0;
        window.cycleBoss = (dir) => {
            window.currentBossIndex += dir;
            if (window.currentBossIndex < 0) window.currentBossIndex = 6;
            if (window.currentBossIndex > 6) window.currentBossIndex = 0;
            
            const titles = ["World 1 Boss", "World 2 Boss", "World 3 Boss", "World 4 Boss", "World 5 Boss", "World 6 Boss", "World 7 Guardian"];
            document.getElementById('boss-thumbnail-label').innerText = titles[window.currentBossIndex];
            
            let canvas = document.getElementById('boss-thumbnail');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,128,128);
            
            if (window.currentBossIndex === 6) {
                ctx.save(); ctx.scale(0.5, 0.5); // scale down 256x256 to 128x128
                window.drawGuardian(ctx, 0, 'annoyed');
                ctx.restore();
            } else {
                let bHats = ['chef', 'neon', 'gorilla', 'penguin', 'cosmos', 'default']; 
                let bCols = ['#f87171', '#c084fc', '#4ade80', '#60a5fa', '#a78bfa', '#fbbf24'];
                window.drawBoss(ctx, 0, 'annoyed', bHats[window.currentBossIndex], bCols[window.currentBossIndex]);
            }
        };
        window.appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initFirebase = async () => {
            try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                const { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                const { getFirestore, doc, setDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                window.firebaseDb = getFirestore(app);
                window.setDoc = setDoc;
                window.getDoc = getDoc;
                window.doc = doc;
                
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => { window.firebaseUser = user; if(user) window.loadGameData(document.getElementById('playerName').value || 'Hero'); });
            } catch(e) { console.error("Firebase init error:", e); }
        };
        initFirebase();

        window.saveGameData = async function() {
            if (!window.firebaseDb || !window.firebaseUser) return;
            try {
                const saveRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'users', window.firebaseUser.uid, 'saves', globalPlayerName);
                await window.setDoc(saveRef, {
                    money: window.gameStats.money, unlockedBelts: window.unlockedBelts, unlockedUltimateBelt: window.unlockedUltimateBelt,
                    unlockedLionHelmet: window.unlockedLionHelmet, unlockedKarate: window.unlockedKarate, unlockedMacho: window.unlockedMacho, unlockedLevitate: window.unlockedLevitate
                }, { merge: true });
            } catch(e) {}
        };

        window.loadGameData = async function(playerName) {
            if (!window.firebaseDb || !window.firebaseUser) return;
            try {
                const saveRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'users', window.firebaseUser.uid, 'saves', playerName);
                const snap = await window.getDoc(saveRef);
                if (snap.exists()) {
                    let d = snap.data();
                    window.gameStats.money = d.money || 0; window.unlockedBelts = d.unlockedBelts || []; window.unlockedUltimateBelt = d.unlockedUltimateBelt || false;
                    window.unlockedLionHelmet = d.unlockedLionHelmet || false; window.unlockedKarate = d.unlockedKarate || false;
                    window.unlockedMacho = d.unlockedMacho || false; window.unlockedLevitate = d.unlockedLevitate || false;
                    window.updateEquipmentUI();
                }
            } catch(e) {}
        };

        window.updateEquipmentUI = function() {
            let isGod = (globalPlayerName === 'Remy55555!');
            document.getElementById('bonus-equipment').style.display = 'block';
            if (window.unlockedLionHelmet || isGod) document.getElementById('helmet-group').style.display = 'inline-block';
            if (window.unlockedUltimateBelt || isGod) document.getElementById('belt-group').style.display = 'inline-block';

            if (window.unlockedLevitate || isGod) document.getElementById('power-group').style.display = 'inline-block';
            if (window.unlockedBelts.length >= 7 || isGod) {
                document.getElementById('level-select-group').style.display = 'block';
                document.getElementById('portrait-alien-container').style.display = 'block';

                document.getElementById('level-select-group').style.display = 'none';
                document.getElementById('portrait-alien-container').style.display = 'none';
                document.getElementById('boss-gallery-group').style.display = 'none';
            }
        };

        const kidFont = '"Bubblegum Sans", cursive';
        const titleFont = '"Luckiest Guy", cursive';
        
        let globalSkinTone = '#c68642'; 
        let globalGender = 'boy';
        let globalPlayerName = 'Hero';
        let globalHelmet = 'none';
        let globalBelt = 'none';
        let globalOutfit = 'default';
        let globalGlasses = 'none';
        let globalPower = 'none';
        
        let playerCanvas = null;

        function drawNinjaOnCtx(ctx, x, pose, emotion, gGender, gSkinTone, gOutfit, gBelt, gHelmet, gGlasses, gKarate, gMacho) {
            ctx.save(); ctx.translate(x, 0); ctx.shadowColor = 'white'; ctx.shadowBlur = 4;
            const cx = 32; const cy = 36; 
            
            if(gGender === 'girl') {
                ctx.fillStyle = gSkinTone === '#ffdfc4' ? '#facc15' : '#451a03';
                let rotHair = pose === 'run1' || pose === 'run2' ? 0.3 : (pose === 'jump' ? -0.2 : 0);
                ctx.save(); ctx.translate(cx-10, cy-12); ctx.rotate(rotHair);
                ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-15, 5, -10, 20); ctx.lineTo(-4, 0); ctx.fill();
                ctx.restore();
            }
            
            let isKarate = (gOutfit === 'karate' || gKarate);
            ctx.fillStyle = isKarate ? "#ffffff" : (gGender === 'boy' ? "#1e1b4b" : (gGender === 'alien' ? "#0f766e" : "#4c1d95")); 
            
            let yBob = 0, rot = 0;
            if(pose === 'run1') { yBob = -2; rot = 0.1; } else if(pose === 'run2') { yBob = 2; rot = 0.2; } else if(pose === 'jump' || pose === 'handsup') { yBob = -4; rot = -0.1; }
            
            ctx.save(); ctx.translate(cx, cy + yBob); ctx.rotate(rot);
            if(pose === 'run1') { ctx.fillRect(-8, 10, 8, 14); ctx.fillRect(4, 8, 8, 14); if(isKarate){ ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-8,10,8,14); ctx.strokeRect(4,8,8,14); } } 
            else if(pose === 'run2') { ctx.fillRect(-4, 10, 8, 14); ctx.fillRect(8, 8, 8, 14); if(isKarate){ ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-4,10,8,14); ctx.strokeRect(8,8,8,14); } } 
            else if(pose === 'jump') { ctx.fillRect(-6, 12, 8, 10); ctx.fillRect(2, 10, 8, 12); if(isKarate){ ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-6,12,8,10); ctx.strokeRect(2,10,8,12); } } 
            else { ctx.fillRect(-6, 12, 6, 12); ctx.fillRect(2, 12, 6, 12); if(isKarate){ ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-6,12,6,12); ctx.strokeRect(2,12,6,12); } }
            
            ctx.fillRect(-12, -8, 24, 22); 
            if (isKarate) { 
                ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-12, -8, 24, 22); 
                ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(0, 4); ctx.lineTo(6, -8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, 14); ctx.stroke();
            }
            
            if (isKarate) {
                ctx.fillStyle = "#000000"; ctx.fillRect(-13, 10, 26, 6);
            } else {
                ctx.fillStyle = gGender==='girl' ? '#f472b6' : (gGender==='alien' ? '#38bdf8' : '#dc2626'); ctx.fillRect(-12, 8, 24, 4); 
            }
            
            if (gBelt === 'equipped') {
                ctx.fillStyle = '#b45309'; ctx.fillRect(-13, 10, 26, 6);
                ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(0, 13, 7, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 13, 3, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
            
            ctx.save(); ctx.translate(cx, cy - 16 + yBob);
            ctx.fillStyle = isKarate ? "#ffffff" : (gGender === 'boy' ? "#1e1b4b" : (gGender==='alien' ? '#0f766e' : "#4c1d95")); ctx.fillRect(-16, -18, 32, 32); 
            if(isKarate){ ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-16,-18,32,32); }

        function initAudio() {

        function playSynth(type, freq, duration, slide = 0, volume = 0.1) {
            if(isMuted) return;
            if(!audioCtx) initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            if (globalGender === 'girl' && freq > 100) {
                if (type === 'square') type = 'sine';
                if (type === 'sawtooth') type = 'triangle';
                freq *= 1.3;
            } else if (globalGender === 'alien' && freq > 100) {
                if (type === 'square' || type === 'triangle') type = 'sawtooth';
                freq *= 0.5;
            }

            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.connect(gain); gain.connect(masterGain);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slide !== 0) { osc.frequency.exponentialRampToValueAtTime(Math.max(freq + slide, 10), audioCtx.currentTime + duration); }
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playOcarinaNote(freq, startTime, duration, vol = 0.2) {
            if(isMuted) return;
            if(!audioCtx) initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
            osc.type = 'triangle'; lfo.type = 'sine'; lfo.frequency.value = 6; lfoGain.gain.value = 5;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency); osc.connect(gain); gain.connect(masterGain);
            osc.frequency.value = freq;
            if (globalGender === 'alien') { osc.type = 'square'; freq *= 0.7; }
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(vol, startTime + 0.05);
            gain.gain.setValueAtTime(vol, startTime + duration - 0.05);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);
            lfo.start(startTime); osc.start(startTime);
            osc.stop(startTime + duration); lfo.stop(startTime + duration);
        }

        function initPhaser() {
            window.storeBank = [];
            for(let i=0; i<30; i++) {
                let cost = (Math.random() * 18.50 + 0.50);
                cost = Math.floor(cost * 4) / 4; 
                if (i%2 === 0) cost = Math.floor((Math.random()*18+1)*10)/10; 
                let costStr = cost.toFixed(2);
                let change = (20.00 - cost).toFixed(2);
                let wrong1 = (parseFloat(change) + 1.00).toFixed(2);
                let wrong2 = (parseFloat(change) - 0.10).toFixed(2);
                window.storeBank.push({
                    q: `If an item costs $${costStr} and you purchase it using a $20 bill, what would your change be?`,
                    a: `$${change}`, options: [`$${change}`, `$${wrong1}`, `$${wrong2}`]
                });
            }
            for(let i=0; i<30; i++) {
                let cents = [15, 30, 45, 60, 75, 80, 90, 35, 40, 65, 85, 95][i % 12] || (Math.floor(Math.random()*18 + 1)*5);
                let valStr = (cents / 100).toFixed(2);
                let q = Math.floor(cents / 25); let r = cents % 25;
                let d = Math.floor(r / 10); r = r % 10;
                let n = Math.floor(r / 5);
                
                let build = (q,d,n) => {
                    let pts=[];
                    if(q) pts.push(`${q} quarter${q>1?'s':''}`);
                    if(d) pts.push(`${d} dime${d>1?'s':''}`);
                    if(n) pts.push(`${n} nickel${n>1?'s':''}`);
                    return pts.join(" and ") || "No change";
                };
                let a = build(q,d,n); let w1 = build(Math.max(0,q-1), d+2, n+1); let w2 = build(q, Math.max(0,d-1), n+2);
                if (q===0) w1 = build(q, d, n+3);
                if (d===0) w2 = build(q, d+1, Math.max(0,n-2));
                if (a===w1) w1 = build(q+1, d, n);
                if (a===w2) w2 = build(q, d+1, n);
                
                window.storeBank.push({
                    q: `What's the most efficient way to give change of $${valStr}?`,
                    a: a, options: [a, w1, w2]
                });

                buildWorldLevel() {
                    const floorY = 480; let keySuffix = this.currentWorld;
                    let foeCounts = [25, 35, 45, 55, 65, 75, 85]; let maxFoes = foeCounts[this.currentWorld - 1];
                    let startX = (this.currentWorld === 1) ? 5200 : 32;

                    if (!this.levelLength) this.levelLength = startX + Math.max(3000, maxFoes * 500 + 1000);
                    let numPlatforms = Math.ceil((this.levelLength - startX) / 64);

                    let possibleBonsai = [
                        Math.floor(numPlatforms * 0.15), Math.floor(numPlatforms * 0.35),
                        Math.floor(numPlatforms * 0.55), Math.floor(numPlatforms * 0.75), Math.floor(numPlatforms * 0.90)
                    ];
                    Phaser.Utils.Array.Shuffle(possibleBonsai);
                    let bonsaiMilestones = possibleBonsai.slice(0, Math.floor(Math.random() * 2) + 2); // 2 to 3 trees

                    let pogoMilestones = [
                        Math.floor(numPlatforms * 0.25),
                        Math.floor(numPlatforms * 0.65),
                        Math.floor(numPlatforms * 0.85)
                    ];
                    let lightningMilestone = Math.max(10, Math.floor((numPlatforms * 0.50) / 10) * 10);

                    if (this.currentWorld > 1) {
                        this.storeBuilding = this.physics.add.staticSprite(startX + 180, floorY - 64, 'store_building');
                    }

                    for(let i=0; i<numPlatforms; i++) {
                        let px = startX + i*64;
                        let isPit = (i > 10 && i < numPlatforms - 15 && (i % 12 === 0 || i % 12 === 1)); 
                        if (!isPit) this.platforms.create(px, floorY, `platform_${keySuffix}`);

                        let hasMidPlatform = (i % 8 >= 4 && i > 5 && i < numPlatforms - 10);
                        if (hasMidPlatform) this.platforms.create(px, floorY - 140, `platform_${keySuffix}`);
                        
                        let hasHighPlatform = (i % 12 >= 9 && i > 10 && i < numPlatforms - 10);
                        if (hasHighPlatform) {
                            this.platforms.create(px, floorY - 280, `platform_${keySuffix}`);
                            if (i % 24 === 0) this.spawnItem(px, floorY - 280 + 32, 'gem'); 
                        }
                        
                        let isBossArena = px > this.levelLength - 800;
                        if (isBossArena && !isPit && i < numPlatforms - 2) {
                            if (i % 5 === 0) {
                                this.platforms.create(px, floorY - 140, `platform_${keySuffix}`);
                                this.platforms.create(px + 64, floorY - 140, `platform_${keySuffix}`);
                            }
                        }
                        
                        if (i > 10 && i < numPlatforms - 5 && !isBossArena) {
                            if (hasHighPlatform && Math.random() < 0.25) {
                                let r = Math.random();
                                if (r < 0.20) { this.spawnBirdFoe(px, floorY - 340 - 60); } 
                                else if (r < 0.40) { this.spawnMathFoe(px, 10, false, false, true); } 
                                else if (r < 0.55) { this.spawnWormFoe(px, floorY - 340); }
                                else if (r < 0.70) { this.spawnMathFoe(px, floorY - 340, false, true, false); } 
                                else if (r < 0.85) { this.spawnMathFoe(px, floorY - 340 - 80, true, false, false); } 
                                else { this.spawnMathFoe(px, floorY - 340, false, false, false); }
                            }
                            if (hasMidPlatform && Math.random() < 0.25) {
                                let r = Math.random();

                                else { this.spawnMathFoe(px, floorY - 200, false, false, false); }

                        let hasFloorFoe = (i % 6 === 0 && !isPit && !hasMidPlatform && !hasHighPlatform && i > 10 && i < numPlatforms - 10 && !isBossArena);
                        if (hasFloorFoe && Math.random() < 0.35) {
                            let rx = px + 32; let r = Math.random();

                        if (this.currentWorld === 7 && i % 10 === 0 && !isPit && i > 5 && i < numPlatforms - 10) {
                            let lamp = this.lamps.create(px, floorY - 340, 'lamp');

                        }

                        if (i > 10 && i % 10 === 0 && !isPit && !isBossArena) {
                            let blockY = hasMidPlatform ? floorY - 200 : floorY - 64;
                            let blk = this.blocks.create(px, blockY, `block_${keySuffix}`);
                            if (bonsaiMilestones.includes(i)) blk.fixedItem = 'bonsai'; 
                            else if (pogoMilestones.includes(i)) blk.fixedItem = 'pogo';
                            else if (i === lightningMilestone) blk.fixedItem = 'lightning_bolt'; 
                        }
                        
                        if (this.currentWorld === 1 && i === Math.floor(numPlatforms/2)) this.spawnItem(px, floorY - 200, 'pizza'); 
                        if (i === numPlatforms - 10) this.spawnItem(px, floorY - 200, 'heart'); 
                    }

                    let halfPlatformIdx = Math.floor(numPlatforms / 2);
                    while((halfPlatformIdx > 10 && halfPlatformIdx < numPlatforms - 15 && (halfPlatformIdx % 12 === 0 || halfPlatformIdx % 12 === 1))) { halfPlatformIdx++; }
                    this.halfwayX = startX + halfPlatformIdx * 64;
                    this.add.image(this.halfwayX, floorY - 32, 'signpost');
                    
                    this.passedCheckpoint = (this.checkpointX > 0);

                update(time, delta) {
                    if (!this.sys || !this.sys.isActive()) return;

                    
                    let padJump = false, padGreen = false, padRed = false, padUp = false, padDown = false, padLeft = false, padRight = false, padPause = false, padEnter = false;
                    // Find first active gamepad — not always at index 0
                    let pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
                    let pad = pads.find(p => p && p.connected) || null;
                    if (pad) {
                        // Read all axes — fight sticks (Hori, etc.) may use axes 0/1, 2/3, 4/5, 6/7, or individual axes
                        let axH = 0, axV = 0;
                        for (let ai = 0; ai < pad.axes.length; ai++) {
                            let val = pad.axes[ai] || 0;
                            // Even axes = horizontal, odd = vertical (standard mapping)
                            // BUT also check HAT-style: axis 6 = H (-1 left,+1 right), axis 7 = V (-1 up,+1 down)
                            if (ai % 2 === 0 && Math.abs(val) > Math.abs(axH)) axH = val;
                            if (ai % 2 === 1 && Math.abs(val) > Math.abs(axV)) axV = val;
                        }
                        padUp    = axV < -0.5 || pad.buttons[12]?.pressed || (customControls.up.startsWith('Pad Btn')    && pad.buttons[parseInt(customControls.up.split(' ')[2])]?.pressed)    || (customControls.up.startsWith('Pad Axis') && (customControls.up.endsWith('+') ? (pad.axes[parseInt(customControls.up.split(' ')[2])] > 0.5) : (pad.axes[parseInt(customControls.up.split(' ')[2])] < -0.5)));
                        padDown  = axV >  0.5 || pad.buttons[13]?.pressed || (customControls.down.startsWith('Pad Btn')  && pad.buttons[parseInt(customControls.down.split(' ')[2])]?.pressed)  || (customControls.down.startsWith('Pad Axis') && (customControls.down.endsWith('+') ? (pad.axes[parseInt(customControls.down.split(' ')[2])] > 0.5) : (pad.axes[parseInt(customControls.down.split(' ')[2])] < -0.5)));
                        padLeft  = axH < -0.5 || pad.buttons[14]?.pressed || (customControls.left.startsWith('Pad Btn')  && pad.buttons[parseInt(customControls.left.split(' ')[2])]?.pressed)  || (customControls.left.startsWith('Pad Axis') && (customControls.left.endsWith('+') ? (pad.axes[parseInt(customControls.left.split(' ')[2])] > 0.5) : (pad.axes[parseInt(customControls.left.split(' ')[2])] < -0.5)));
                        padRight = axH >  0.5 || pad.buttons[15]?.pressed || (customControls.right.startsWith('Pad Btn') && pad.buttons[parseInt(customControls.right.split(' ')[2])]?.pressed) || (customControls.right.startsWith('Pad Axis') && (customControls.right.endsWith('+') ? (pad.axes[parseInt(customControls.right.split(' ')[2])] > 0.5) : (pad.axes[parseInt(customControls.right.split(' ')[2])] < -0.5)));
                        // Xbox: A(0)/B(1)=jump, X(2)=green shot, Y(3)/RB(5)/RT(7)=red shot — no overlap
                        let mappedPadBtns = new Set();
                        for (let k in customControls) {
                            if (customControls[k].startsWith('Pad Btn')) mappedPadBtns.add(parseInt(customControls[k].split(' ')[2]));
                        }
                        let isBtn = (defBtns) => defBtns.some(b => pad.buttons[b]?.pressed && !mappedPadBtns.has(b));
                        
                        padJump  = isBtn([0, 1]) || (customControls.jump.startsWith('Pad Btn')  && pad.buttons[parseInt(customControls.jump.split(' ')[2])]?.pressed);
                        padGreen = isBtn([2]) || (customControls.green.startsWith('Pad Btn') && pad.buttons[parseInt(customControls.green.split(' ')[2])]?.pressed);
                        padRed   = isBtn([3, 5, 7]) || (customControls.red.startsWith('Pad Btn') && pad.buttons[parseInt(customControls.red.split(' ')[2])]?.pressed);
                        padPause = isBtn([9]) || (customControls.pause.startsWith('Pad Btn') && pad.buttons[parseInt(customControls.pause.split(' ')[2])]?.pressed);
                        padEnter = (customControls.enter.startsWith('Pad Btn') && pad.buttons[parseInt(customControls.enter.split(' ')[2])]?.pressed);
                    }
                    
                    let inp = {
                        up:    this.keys.up.isDown    || this.cursors.up.isDown    || this.keys.cUp.isDown    || padUp,
                        down:  this.keys.down.isDown  || this.cursors.down.isDown  || this.keys.cDown.isDown  || padDown,
                        left:  this.keys.left.isDown  || this.cursors.left.isDown  || this.keys.cLeft.isDown  || padLeft,
                        right: this.keys.right.isDown || this.cursors.right.isDown || this.keys.cRight.isDown || padRight,
                        jump: this.keys.jump.isDown || this.keys.altKey?.isDown || this.keys.spaceKey?.isDown || this.keys.wKey?.isDown || padJump,
                        jumpJustDown: this._jumpPressed || (padJump && !this.prevPad.jump),
                        green: this.keys.fireGreen.isDown || padGreen || (this.keys.zKey?.isDown),
                        greenJustUp: Phaser.Input.Keyboard.JustUp(this.keys.fireGreen) || (this.keys.zKey && Phaser.Input.Keyboard.JustUp(this.keys.zKey)) || (!padGreen && this.prevPad.green),
                        red: this.keys.fireRed.isDown || padRed || (this.keys.xKey?.isDown),
                        redJustUp: Phaser.Input.Keyboard.JustUp(this.keys.fireRed) || (this.keys.xKey && Phaser.Input.Keyboard.JustUp(this.keys.xKey)) || (!padRed && this.prevPad.red),
                        pauseJustDown:  Phaser.Input.Keyboard.JustDown(this.keys.pause)  || (padPause && !this.prevPad.pause),
                        enterJustDown:  Phaser.Input.Keyboard.JustDown(this.keys.enter)  || (padEnter && !this.prevPad.enter),
                        upJustDown:    Phaser.Input.Keyboard.JustDown(this.keys.up)    || Phaser.Input.Keyboard.JustDown(this.keys.cUp)    || (padUp    && !this.prevPad.up),
                        downJustDown:  Phaser.Input.Keyboard.JustDown(this.keys.down)  || Phaser.Input.Keyboard.JustDown(this.keys.cDown)  || (padDown  && !this.prevPad.down),
                        leftJustDown:  Phaser.Input.Keyboard.JustDown(this.keys.left)  || Phaser.Input.Keyboard.JustDown(this.keys.cLeft)  || (padLeft  && !this.prevPad.left),
                        rightJustDown: Phaser.Input.Keyboard.JustDown(this.keys.right) || Phaser.Input.Keyboard.JustDown(this.keys.cRight) || (padRight && !this.prevPad.right)
                    };
                    
                    if (this.isShopping) {
                        if (this.shopQContainer) {
                            if (inp.upJustDown || inp.leftJustDown) { if (this._shopQNavigate) this._shopQNavigate(-1); }
                            else if (inp.downJustDown || inp.rightJustDown) { if (this._shopQNavigate) this._shopQNavigate(1); }
                            else if (inp.enterJustDown || inp.jumpJustDown) { if (this._shopQSelect) this._shopQSelect(); }
                        } else {
                            if (inp.upJustDown || inp.leftJustDown) { if (this._storeNavigate) this._storeNavigate(-1); }
                            else if (inp.downJustDown || inp.rightJustDown) { if (this._storeNavigate) this._storeNavigate(1); }
                            else if (inp.enterJustDown || inp.jumpJustDown) { if (this._storeSelect) this._storeSelect(); }
                            else if (inp.pauseJustDown) { this.closeStore(); }
                        }
                    }
                    
                    if (inp.pauseJustDown && !this.isShopping && !this.isAnswering) {
                        this.isPaused = !this.isPaused;
                        if(this.isPaused) { 
                            this.physics.pause(); 
                            if(this.pauseText) this.pauseText.setVisible(true); 
                            if(typeof audioCtx !== 'undefined' && audioCtx.state === 'running') audioCtx.suspend();
                        } else { 
                            this.physics.resume(); 
                            if(this.pauseText) this.pauseText.setVisible(false); 
                            if(typeof audioCtx !== 'undefined' && audioCtx.state === 'suspended') audioCtx.resume();
                        }
                    }
                    
                    if (this.isWinning) {
                        return;
                    }
                    
                    if(this.isPaused || this.isDead || this.isAnswering || this.isShopping) return;

                    if (this.storeBuilding && Math.abs(this.player.x - this.storeBuilding.x) < 50 && this.player.y > 350) {
                        if (!this.storePromptText) {
                            this.storePromptText = this.add.text(this.storeBuilding.x, this.storeBuilding.y - 80, "Press UP for Shop", { fontFamily: titleFont, fontSize: '24px', color: '#facc15', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(200);
                        }
                        if (inp.up && !this.prevPad.up) {
                            this.openStore();
                        }
                    } else if (this.storePromptText) {
                        this.storePromptText.destroy(); this.storePromptText = null;
                    }

                    if(this.bgM) this.bgM.tilePositionX = this.cameras.main.scrollX * 0.2;
                    if(this.bgF) this.bgF.tilePositionX = this.cameras.main.scrollX * 0.5;
                    
                    // NEW BOSS MOVEMENT LOGIC
                    if (this.boss && this.boss.active && this.bossEngaged && !this.isDead && !this.isWinning) {
                        
                        if (!this.boss.stateTimer) {
                            this.boss.stateTimer = 0;
                            this.boss.bossState = 'avoid';
                        }
                        this.boss.stateTimer += delta;

                        if (this.boss.stateTimer > 3500) { // Change pattern every 3.5 seconds
                            this.boss.stateTimer = 0;
                            let rand = Math.random();
                            
                            if (this.currentWorld === 7 && rand < 0.35) { // Final boss jumps!
                                this.boss.bossState = 'jump';
                                this.boss.jumpTargetX = this.player.x;
                                this.boss.body.allowGravity = true;
                                this.boss.body.setVelocityY(-900);
                            } else if (rand < 0.3) {
                                this.boss.bossState = 'chase';
                            } else if (rand < 0.6) {
                                this.boss.bossState = 'sweep';
                                this.boss.sweepTargetX = Math.random() > 0.5 ? this.levelLength - 100 : this.levelLength - 700;
                                this.boss.sweepTargetY = Math.random() * 250 + 100;
                            } else {
                                this.boss.bossState = 'avoid';
                            }
                        }

                        let targetX = this.boss.x;
                        let targetY = this.boss.y;

                        if (this.boss.bossState === 'jump' && this.currentWorld === 7) {
                            targetX = this.boss.jumpTargetX;
                            this.boss.body.setVelocityX((targetX - this.boss.x) * 1.5);
                            
                            // Check landing condition
                            if (this.boss.body.velocity.y > 0 && this.boss.y > 300) {
                                this.boss.y = 300;
                                this.boss.body.allowGravity = false;
                                this.boss.body.setVelocityY(0);
                                this.boss.bossState = 'avoid';
                                this.boss.stateTimer = 0;
                                
                                this.cameras.main.shake(300, 0.02);
                                playThunder(); // Acts as a heavy slam/thud noise
                            }
                        } else {
                            if (this.boss.body.allowGravity) {
                                this.boss.body.allowGravity = false;
                            }
                            
                            if (this.boss.bossState === 'chase') {
                                targetX = this.player.x;
                                targetY = this.player.y - 50; 
                            } else if (this.boss.bossState === 'sweep') {
                                targetX = this.boss.sweepTargetX;
                                targetY = this.boss.sweepTargetY;
                            } else { // default 'avoid'
                                targetX = (this.levelLength - 400) + ( (this.levelLength - 400) - this.player.x ) * 0.4;
                                targetY = 250 + ( 300 - this.player.y ) * 0.4;
                            }

                            targetX = Phaser.Math.Clamp(targetX, this.levelLength - 750, this.levelLength - 50);
                            targetY = Phaser.Math.Clamp(targetY, 50, 420);

                            this.boss.body.setVelocityX((targetX - this.boss.x) * 2);
                            this.boss.body.setVelocityY((targetY - this.boss.y) * 2);
                        }
                        
                        if (this.bossText) {
                            this.bossText.x = this.boss.x;
                            this.bossText.y = this.boss.y - (this.currentWorld === 7 ? 160 : 100);
                        }
                    }
                    
                    if (!this.bossEngaged && this.player.x > this.levelLength - 700) {
                        this.bossEngaged = true;
                        let arenaStartX = this.levelLength - 800;
                        this.physics.world.setBounds(arenaStartX, 0, 800, 540, true, true, true, false);
                        this.cameras.main.setBounds(arenaStartX, 0, 800, 540);
                        for(let y=0; y<540; y+=64) {
                            let blockVisual = this.add.image(arenaStartX + 32, y + 32, `block_${this.currentWorld}`);
                            blockVisual.setDepth(20);
                        }
                        this.enemies.getChildren().forEach(foe => {
                            if (!foe.isBoss) {
                                this.destroyFoeCleanly(foe, false);
                            }
                        });
                    }
                    
                    // Update prevPad here in update() where pad/padJump vars are in scope
                    if (pad) { this.prevPad = { jump: padJump, green: padGreen, red: padRed, pause: padPause, up: padUp, down: padDown, left: padLeft, right: padRight, enter: padEnter }; }
                    
                    this.handlePlayerLogic(time, delta, inp);
                    
                    // Clear raw input flags — must happen AFTER handlePlayerLogic consumes them
                    this._jumpPressed = false;
                    this._dropPressed = false;
                    
                    if (this.currentWorld === 7 && this.darknessOverlay) {
                        if (this.lightPhase === 'fading_off') this.darknessOverlay.alpha = Phaser.Math.Clamp(this.darknessOverlay.alpha + (delta / 5000) * 0.9, 0, 0.85);
                        else if (this.lightPhase === 'fading_on') this.darknessOverlay.alpha = Phaser.Math.Clamp(this.darknessOverlay.alpha - (delta / 5000) * 0.9, 0, 0.85);
                        else if (this.lightPhase === 'off') this.darknessOverlay.alpha = 0.85;
                        else if (this.lightPhase === 'on') this.darknessOverlay.alpha = 0;

                        let underLamp = false;
                        this.lamps.getChildren().forEach(lamp => {
                            if (Math.abs(this.player.x - lamp.x) < 80 && this.player.y > lamp.y && this.player.y < lamp.y + 300) {
                                underLamp = true;
                            }
                        });

                        if (underLamp || this.player.isInvincible) {
                            this.player.setDepth(45);
                            if (this.pogoAura) this.pogoAura.setDepth(44);
                            if (this.lightningAura) this.lightningAura.setDepth(44);
                            if (this.chargeG) this.chargeG.setDepth(46);
                        } else {
                            this.player.setDepth(10);
                            if (this.pogoAura) this.pogoAura.setDepth(9);
                            if (this.lightningAura) this.lightningAura.setDepth(9);
                            if (this.chargeG) this.chargeG.setDepth(11);
                        }
                    }

                    if (!this.passedCheckpoint && this.halfwayX && this.player.x >= this.halfwayX) {
                        this.passedCheckpoint = true;
                        let msg = this.add.text(480, 150, "You're 1/2 Way There!", { fontFamily: titleFont, fontSize: '40px', color: '#facc15', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setScrollFactor(0).setDepth(100);
                        this.tweens.add({ targets: msg, y: 100, alpha: 0, duration: 3000, onComplete: () => msg.destroy() });
                        playPowerup();
                    }

                    if(this.bossBalls) {
                        this.bossBalls.getChildren().forEach(ball => {
                            if(ball && ball.active) {
                                if (ball.mathText && ball.mathText.scene) {
                                    ball.mathText.x = ball.x; ball.mathText.y = ball.y - 40;
                                }
                                if (ball.y > 1000) {
                                    if (ball.mathText) ball.mathText.destroy();
                                    ball.destroy();
                                }
                            }
                        });
                    }
                    
                    this.enemies.getChildren().forEach(foe => {
                        if(foe && foe.active) {
                            if(foe.isFlashing) foe.setTint(Phaser.Display.Color.HSVToRGB((time%1000)/1000, 1, 1).color);
                            if(foe.mathText && foe.mathText.scene) { foe.mathText.x = foe.x; foe.mathText.y = Phaser.Math.Clamp(foe.y - (foe.isGiant ? 110 : 50), this.cameras.main.scrollY + 35, 540); }
                            
                            if (foe.isChute) {
                                if (foe.body.blocked.down || foe.body.touching.down) {
                                    foe.isChute = false; foe.body.setMaxVelocityY(1200); 
                                    foe.setTexture(`foe_${Math.floor(Math.random() * 6) + 1}`);
                                    foe.body.setSize(36, 40); foe.body.setOffset(6, 16);
                                    foe.body.setVelocityX(Math.random() > 0.5 ? 50 : -50);
                                }
                            }

                            if (foe.isWorm) {
                                let closest = this.physics.closest(foe, this.platforms.getChildren());
                                if (!foe.lastTransitionTime) foe.lastTransitionTime = 0;
                                if (closest && closest.y < 450 && Phaser.Math.Distance.Between(foe.x, foe.y, closest.x, closest.y) <= 80) {
                                    let dx = foe.x - closest.x; let dy = foe.y - closest.y; let mag = 1200; let gx=0, gy=0, rot=0, face='top';
                                    if (Math.abs(dx) > Math.abs(dy)) {
                                        if (dx > 0) { gx = -mag; gy = 0; rot = Math.PI/2; face = 'right'; }
                                        else { gx = mag; gy = 0; rot = -Math.PI/2; face = 'left'; }
                                    } else {
                                        if (dy > 0) { gx = 0; gy = -mag; rot = Math.PI; face = 'bottom'; }
                                        else { gx = 0; gy = mag; rot = 0; face = 'top'; }
                                    }
                                    if (foe.lastFace !== face && time - foe.lastTransitionTime > 400) {
                                        foe.body.gravity.x = gx; foe.body.gravity.y = gy; foe.setRotation(rot);
                                        if (face === 'top' || face === 'bottom') foe.setVelocityY(0);
                                        if (face === 'left' || face === 'right') foe.setVelocityX(0);
                                        foe.lastFace = face; foe.lastTransitionTime = time;
                                    }
                                    let speed = 80; let currentFace = foe.lastFace || 'top';
                                    if (currentFace === 'top') { foe.setVelocityX(speed); foe.setVelocityY(0); }
                                    else if (currentFace === 'right') { foe.setVelocityY(speed); foe.setVelocityX(0); }
                                    else if (currentFace === 'bottom') { foe.setVelocityX(-speed); foe.setVelocityY(0); }
                                    else if (currentFace === 'left') { foe.setVelocityY(-speed); foe.setVelocityX(0); }
                                } else {
                                    foe.body.gravity.x = 0; foe.body.gravity.y = 1200; foe.setRotation(0); foe.setVelocityX(-40); 
                                }
                            }
                            else if(foe.isBird) { 
                                if (foe.x < this.cameras.main.scrollX - 200 || foe.x > this.cameras.main.scrollX + 1200) {
                                    if(foe.mathText) foe.mathText.destroy(); if(foe.hpBarBg) foe.hpBarBg.destroy(); if(foe.hpBar) foe.hpBar.destroy(); foe.destroy();
                                }
                            } 
                            else if (!foe.isBoss) {
                                if (foe.body.blocked.down && !foe.isChute) {
                                    let checkX = foe.x + (foe.body.velocity.x > 0 ? 32 : -32); let hasTile = false; let wallHit = foe.body.blocked.left || foe.body.blocked.right;
                                    this.platforms.getChildren().forEach(p => { if (Math.abs(p.x - checkX) < 32 && Math.abs(p.y - (foe.y + foe.body.height/2 + 20)) < 40) hasTile = true; });
                                    if (!hasTile || wallHit) { 
                                        if (Math.random() < 0.40 && !foe.isGiant) foe.body.setVelocityY(-550);

                                    }
